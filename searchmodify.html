<script>
// =====================================================================
// WarehouseApp / SearchModify 두 다이얼로그가 공유하는 로직
// ---------------------------------------------------------------------
// 이전에는 loadStockData / printReceipt가 파일별로 복제되어 있었고,
// 한쪽만 수정되는 일이 반복됐다 (예: 인쇄 콜백 미실행 시 커밋 후 장바구니
// 미정리 → 재전송 위험). 두 화면의 공통 뼈대만 이 파일에 두고,
// 화면별로 다른 부분은 호출부가 콜백으로 주입한다.
// =====================================================================

// =====================================================================
// HTML 이스케이프
// ---------------------------------------------------------------------
// 품명·색상·거래처명은 구글 시트에서 오고 작업자가 직접 타이핑하기도 한다.
// 따옴표나 꺾쇠가 섞이면 innerHTML로 조립한 마크업이 깨지거나 주입된다.
// =====================================================================

/** 텍스트 및 속성값용. 0이나 false도 문자열로 보존한다. */
function escapeHtml(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

/**
 * 인라인 핸들러의 인자용. `onclick="fn(${jsArg(name)})"` 형태로 쓰고,
 * 호출부에서 따옴표를 직접 붙이지 않는다.
 *
 * JSON으로 인코딩해 JS 문자열 리터럴을 만든 뒤 HTML 이스케이프하므로,
 * 작은따옴표(L'AMOUR)·큰따옴표·백슬래시가 모두 안전하다. 예전에는
 * `onclick="fn('${name.replace(/'/g, "\\'")}')"` 처럼 작은따옴표만 막아서
 * 큰따옴표가 들어오면 속성이 조기 종료돼 마크업이 깨졌다.
 */
function jsArg(value) {
  return escapeHtml(JSON.stringify(value === undefined ? null : value));
}

// =====================================================================
// 서버 호출 공통 경로
// ---------------------------------------------------------------------
// google.script.run은 취소도 타임아웃도 제공하지 않으므로, 호출 지점마다
// 손으로 가드를 만들어 왔다. 그 결과 재진입 가드·타임아웃·응답 순서 보장이
// 호출부마다 제각각이었고(타임아웃은 19곳 중 1곳에만 존재), 같은 종류의
// 버그가 기능을 추가할 때마다 재발했다. 모든 서버 호출은 이 함수를 통한다.
// =====================================================================

// key -> 그 key에서 유효한 최신 토큰. 토큰은 전역 단조 증가라 재사용되지 않는다.
const _serverCallTokens = Object.create(null);
let _serverCallSeq = 0;

/**
 * @param {string}   fnName            호출할 서버 함수명 (Code.js의 전역 함수)
 * @param {Array}    args              인자 배열
 * @param {Object}   opt
 * @param {string}   opt.key           동시성 그룹. 기본값은 fnName.
 * @param {string}   opt.mode          'block'  진행 중이면 새 호출을 무시 (기본, 쓰기 작업용)
 *                                     'latest' 새 호출이 이전 호출을 무효화 (읽기/검색용)
 * @param {number}   opt.timeout       ms. 0이면 무제한. 기본 30000.
 * @param {Function} opt.onSuccess     (result) => void
 * @param {Function} opt.onError       (error) => void
 * @param {Function} opt.onSettled     성공·실패·타임아웃 후 항상 실행 (버튼 복구 등).
 *                                     단, 무효화된 응답에서는 실행되지 않는다.
 * @param {Function} opt.onBusy        mode 'block'에서 호출이 차단됐을 때
 * @returns {boolean} 호출이 실제로 전송됐는지
 */
function callServer(fnName, args, opt) {
  const o = opt || {};
  const key = o.key || fnName;
  const mode = o.mode === 'latest' ? 'latest' : 'block';
  const timeout = o.timeout === 0 ? 0 : (o.timeout || 30000);

  if (mode === 'block' && _serverCallTokens[key] != null) {
    console.warn(`[callServer] '${key}' 진행 중 — 중복 요청 무시`);
    if (typeof o.onBusy === 'function') o.onBusy();
    else if (typeof o.onError === 'function') {
      o.onError(new Error('이전 요청이 아직 처리 중입니다. 중복 제출을 막기 위해 잠시 기다려 주세요.'));
    }
    return false;
  }

  const token = ++_serverCallSeq;
  _serverCallTokens[key] = token;

  let timer = null;
  let settled = false;
  let timedOut = false;

  const finish = (ok, payload, isTimeout) => {
    // 취소되거나 더 새로운 호출에 추월된 응답은 폐기한다.
    if (_serverCallTokens[key] !== token && !timedOut) return;

    // 타임아웃 이후 실제 응답: 토큰만 해제하고 재시도 이중 커밋을 막는다.
    if (timedOut && !isTimeout) {
      delete _serverCallTokens[key];
      if (ok) {
        console.warn(`[callServer] ${fnName} 타임아웃 이후 성공 — 이미 커밋됐을 수 있으니 재시도하지 마세요.`);
        if (typeof o.onLateSuccess === 'function') o.onLateSuccess(payload);
      } else {
        console.warn(`[callServer] ${fnName} 타임아웃 이후 실패:`, payload);
      }
      return;
    }

    if (settled) return;
    settled = true;
    if (timer) { clearTimeout(timer); timer = null; }

    if (isTimeout) {
      timedOut = true;
    } else {
      delete _serverCallTokens[key];
    }

    try {
      if (ok) {
        if (typeof o.onSuccess === 'function') o.onSuccess(payload);
      } else {
        if (typeof o.onError === 'function') o.onError(payload);
        else console.error(`[callServer] ${fnName} 실패:`, payload);
      }
    } finally {
      if (typeof o.onSettled === 'function') {
        try { o.onSettled(); } catch (e) { console.warn('[callServer] onSettled 오류:', e); }
      }
    }
  };

  if (timeout > 0) {
    timer = setTimeout(
      () => finish(false, new Error(`서버 응답 시간 초과 (${Math.round(timeout / 1000)}초): ${fnName}`), true),
      timeout
    );
  }

  const runner = google.script.run
    .withSuccessHandler(res => finish(true, res))
    .withFailureHandler(err => finish(false, err));

  if (typeof runner[fnName] !== 'function') {
    finish(false, new Error(`서버 함수를 찾을 수 없습니다: ${fnName}`));
    return false;
  }
  runner[fnName].apply(runner, args || []);
  return true;
}

/**
 * 진행 중인 호출을 무효화한다. 요청 자체를 중단시킬 수는 없지만,
 * 뒤늦게 도착한 응답이 화면·장바구니를 건드리지 못하게 막는다.
 */
function cancelServerCall(key) {
  delete _serverCallTokens[key];
}

function isServerCallBusy(key) {
  return _serverCallTokens[key] != null;
}

// 재고 로드 in-flight 가드. filterItems 등 다른 코드도 이 값을 읽는다.
let isLoadingStockData = false;
// 로드 중에 들어온 새로고침 요청. 진행 중인 응답은 요청 이전 시점의 재고일 수 있으므로 끝난 뒤 한 번 더 조용히 읽는다.
let queuedStockReload = null;

function runQueuedStockReload() {
  if (!queuedStockReload) return;
  const next = queuedStockReload;
  queuedStockReload = null;
  setTimeout(() => loadStockDataShared(next), 0);
}

/**
 * 재고 데이터 로드의 공통 뼈대: 재진입 가드, 30초 타임아웃, 로딩 표시,
 * localStorage 영속화, 실패 시 로컬 캐시 유지를 담당한다.
 *
 * @param {Object}   options
 * @param {boolean}  options.silent    로딩 인디케이터를 띄우지 않음
 * @param {Function} options.apply     (data) => 최종 배열. 캐시 반영·렌더를 수행하고
 *                                     localStorage에 저장할 배열을 반환한다.
 * @param {Function} options.hasCache  () => boolean. 실패 시 폴백 데이터 보유 여부.
 */
function loadStockDataShared(options) {
  const opts = options || {};
  const silent = !!opts.silent;
  const apply = typeof opts.apply === 'function' ? opts.apply : (data => data);
  const hasCache = typeof opts.hasCache === 'function' ? opts.hasCache : (() => false);

  if (isLoadingStockData) {
    queuedStockReload = { ...opts, silent: true };
    return;
  }
  isLoadingStockData = true;

  let loadingIndicator = null;
  if (!silent) {
    loadingIndicator = document.createElement('div');
    loadingIndicator.id = 'loadingIndicator';
    loadingIndicator.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 10px; border: 1px solid #ccc; z-index: 1000;';
    loadingIndicator.textContent = '재고 데이터 로드 중...';
    document.body.appendChild(loadingIndicator);
  }

  const sent = callServer('getStockData', [], {
    key: 'stockData',
    mode: 'latest', // ★ 최신 응답 수신 보장 (block으로 차단되지 않음)
    timeout: 20000,
    onSuccess: data => {
      const finalData = apply(data || []);
      const stamp = Date.now().toString();
      try {
        localStorage.setItem('cached_stock_data', JSON.stringify(finalData));
        localStorage.setItem('stock_data_updated', stamp);
      } catch (e) {}
      if (typeof opts.onPersisted === 'function') opts.onPersisted(stamp);
    },
    onError: err => {
      const errMsg = (err && err.message) ? err.message : String(err || '알 수 없는 오류');
      console.error('Failed to load stock data:', errMsg);
      if (typeof opts.onError === 'function') opts.onError(err);
      if (hasCache()) {
        console.warn('⚠️ 최신 재고 조회 실패로 로컬 캐시 재고 데이터를 유지합니다:', errMsg);
      } else if (!silent) {
        alert('재고 데이터를 불러오는 데 실패했습니다: ' + errMsg);
      }
    },
    onSettled: () => {
      isLoadingStockData = false;
      if (loadingIndicator && document.body.contains(loadingIndicator)) {
        document.body.removeChild(loadingIndicator);
      }
      if (typeof opts.onSettled === 'function') opts.onSettled();
      runQueuedStockReload();
    }
  });

  if (!sent) {
    isLoadingStockData = false;
    if (loadingIndicator && document.body.contains(loadingIndicator)) {
      document.body.removeChild(loadingIndicator);
    }
    if (typeof opts.onSettled === 'function') opts.onSettled();
  }
}

/**
 * 입출고증(COMPROBANTE) 2연 인쇄.
 *
 * invoiceNumber는 호출부에 따라 순번만(`001`) 또는 날짜 포함
 * 전체 송장번호(`2026/09/12-001`)로 들어온다. 전표에는 순번만 찍는다.
 *
 * print()가 예외를 던지거나 사용자가 인쇄를 취소해도 callback은 반드시
 * 실행된다. 커밋 후 정리 작업을 이 콜백에 의존하는 호출부가 있기 때문이다.
 */
function printReceipt(records, type, selectedDate, admin, invoiceNumber, callback) {
  const iframe = document.getElementById('printFrame');
  if (!iframe) return;
  const doc = iframe.contentWindow.document;
  const invoiceNo = String(invoiceNumber || '');
  const displayNumber = invoiceNo.includes('-') ? invoiceNo.split('-')[1] : invoiceNo;
  const formattedDate = selectedDate.replace(/-/g, '/');
  const totalItems = new Set(records.map(r => `${r.itemName}_${r.color}`)).size;
  const totalBoxes = records.reduce((sum, r) => sum + Math.abs(r.boxQty), 0);
  const totalIndividuals = records.reduce((sum, r) => sum + Math.abs(r.individualQty), 0);
  const rowsPerPage = 15;
  const pages = Math.ceil(records.length / rowsPerPage);
  const title = type === 'in' ? 'COMPROBANTE DE ENTRADA' : (type === 'adj' ? 'COMPROBANTE DE AJUSTE' : 'COMPROBANTE DE SALIDA');
  const titleColor = type === 'in' ? 'red' : (type === 'adj' ? '#4f46e5' : 'black');
  const adminColor = admin === 'ADMIN' ? 'black' : 'green';
  const adminStyle = `font-size: 11pt; color: ${adminColor};`;
  let htmlContent = '';
  const locationValue = records.length > 0 ? records[0].location : '미지정';
  for (let page = 0; page < pages; page++) {
    const startIdx = page * rowsPerPage;
    const endIdx = Math.min(startIdx + rowsPerPage, records.length);
    const pageRecords = records.slice(startIdx, endIdx);
    let tableRows = '<tr><th>PRODUCTO</th><th>COLOR</th><th>BULTO</th><th>PZS</th><th>PZS/B</th><th>TOTAL</th></tr>';
    for (let i = 0; i < rowsPerPage; i++) {
      if (i < pageRecords.length) {
        const rec = pageRecords[i];
        const boxQty = Math.abs(rec.boxQty);
        const individualQty = Math.abs(rec.individualQty);
        const boxContent = rec.boxContent || 0;
        const totalIndividual = (boxQty * boxContent) + individualQty;
        tableRows += `<tr><td>${rec.itemName}</td><td>${rec.color}</td><td>${boxQty}</td><td>${individualQty}</td><td>${boxContent}</td><td>${totalIndividual}</td></tr>`;
      } else {
        tableRows += `<tr><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
      }
    }
    const summaryTable = page === 0 ? `
      <table class="summary-table">
        <tr><th>cant item</th><th>cant bulto</th><th>cant pzs</th></tr>
        <tr><td>${totalItems}</td><td>${totalBoxes}</td><td>${totalIndividuals}</td></tr>
      </table>
    ` : '';
    htmlContent += `
      <div class="page">
        <div class="receipt-container">
          <div class="receipt">
            <div class="header" style="color: ${titleColor};">${title}</div>
            <div class="details">
              <p>No: ${displayNumber}</p>
              <p>fetcha: ${formattedDate}</p>
              <p class="location">UBICACION: <span class="location-value">${locationValue}</span></p>
              <p class="admin">VENDEDOR: <span style="${adminStyle}">${admin}</span></p>
              ${summaryTable}
            </div>
            <table class="main-table">${tableRows}</table>
            <div class="footer">
              <span>ANIMO!!!</span>
              <span class="page-number">${page + 1}-${pages}</span>
            </div>
          </div>
          <div class="receipt">
            <div class="header" style="color: ${titleColor};">${title}</div>
            <div class="details">
              <p>No: ${displayNumber}</p>
              <p>fetcha: ${formattedDate}</p>
              <p class="location">UBICACION: <span class="location-value">${locationValue}</span></p>
              <p class="admin">VENDEDOR: <span style="${adminStyle}">${admin}</span></p>
              ${summaryTable}
            </div>
            <table class="main-table">${tableRows}</table>
            <div class="footer">
              <span>ANIMO!!!</span>
              <span class="page-number">${page + 1}-${pages}</span>
            </div>
          </div>
        </div>
      </div>
    `;
  }
  doc.open();
  doc.write(`
    <html>
      <head>
        <style>
          @page { size: letter landscape; margin: 0.5in; margin-bottom: 1in; }
          body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
          .page { width: 100%; height: 7.5in; display: flex; justify-content: center; align-items: center; page-break-after: always; margin-bottom: 0.5in; }
          .receipt-container { display: flex; justify-content: space-between; width: 10in; margin-top: 0.2in; }
          .receipt { width: 4.75in; border: 1px solid #000; padding: 0.1in; box-sizing: border-box; margin-bottom: 0.2in; }
          .header { text-align: center; font-weight: bold; font-size: 14pt; margin-bottom: 0.2in; }
          .details { font-size: 10pt; margin-bottom: 0.2in; }
          .details p { margin: 0.05in 0; }
          .location { font-size: 10pt; font-weight: bold; text-decoration: underline; }
          .location-value { color: blue; font-size: 13pt; }
          .admin { font-size: 9pt; font-weight: bold; }
          .summary-table { width: 60%; margin: 0.1in auto; border-collapse: collapse; font-size: 10pt; }
          .summary-table th, .summary-table td { border: 1px solid #000; padding: 0.05in; text-align: center; }
          .summary-table th { background-color: #f2f2f2; font-weight: bold; }
          .main-table { width: 100%; border-collapse: collapse; font-size: 10pt; }
          .main-table th, .main-table td { border: 1px solid #000; padding: 0.05in; text-align: center; height: 0.3in; }
          .main-table th { background-color: #f2f2f2; font-weight: bold; }
          .footer { text-align: center; font-size: 10pt; margin-top: 0.2in; display: flex; justify-content: space-between; align-items: center; }
          .page-number { font-weight: bold; }
        </style>
      </head>
      <body>${htmlContent}</body>
    </html>
  `);
  doc.close();
  iframe.contentWindow.focus();
  setTimeout(() => {
    try {
      iframe.contentWindow.print();
    } catch (printErr) {
      console.warn('printReceipt iframe print error:', printErr);
    }
    if (typeof callback === 'function') {
      try {
        callback();
      } catch (cbErr) {
        console.warn('printReceipt callback error:', cbErr);
      }
    }
  }, 500);
}

// =====================================================================
// 🚀 FlexSearch 기반 초고속 품목/재고 검색엔진 (0.001초 샤샤샥 엔진)
// ---------------------------------------------------------------------
// ktk-wms-v2의 실전 검증된 FlexSearch Document + tokenize: 'full' +
// 스마트 랭킹(rankItemNameMatches) 알고리즘을 완전 탑재하여 수천 개
// 품목 및 12,000+ 셀 매트릭스도 0.001초~0.005초(1~5ms) 내에 즉각 검색합니다.
// =====================================================================
const WmsSearchEngine = (() => {
  let _itemDocIndex = null;
  let _itemMap = new Map();
  let _lastIndexedCount = 0;

  // 1. 스마트 품명 매칭 점수 계산 (ktk-wms-v2 검증 알고리즘)
  // '60' 입력 시 P-160보다 P-D60이 최우선 정렬되도록 가중치 부여
  function scoreItemNameMatch(name, q) {
    const n = String(name || '').toLowerCase();
    if (!n.includes(q)) return 0;
    if (n === q) return 1000;

    let best = 100;
    let from = 0;
    while (from <= n.length) {
      const idx = n.indexOf(q, from);
      if (idx < 0) break;
      const prev = idx > 0 ? n[idx - 1] : '';
      const next = idx + q.length < n.length ? n[idx + q.length] : '';

      if (n.endsWith(q) && idx === n.length - q.length) {
        if (!prev || /[^0-9]/.test(prev)) best = Math.max(best, 900);
        else best = Math.max(best, 250);
      } else if (prev && /[a-z-]/.test(prev) && (!next || /[^0-9]/.test(next))) {
        best = Math.max(best, 800);
      } else if (prev && /\d/.test(prev)) {
        best = Math.max(best, 150);
      } else {
        best = Math.max(best, 500);
      }
      from = idx + 1;
    }
    return best;
  }

  // 2. 검색 결과 스마트 정렬 (정확도 순)
  function rankMatches(items, query) {
    const q = (query || '').trim().toLowerCase();
    if (!q || !items || !items.length) return items || [];

    const scored = [];
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      const rawName = item.name || item.codigo || item.itemName || '';
      let score = scoreItemNameMatch(rawName, q);
      if (score === 0 && (item.color || item.group_name)) {
        const sub = String(item.color || item.group_name || '').toLowerCase();
        if (sub.includes(q)) score = 300;
      }
      if (score > 0) {
        scored.push({ item, idx: i, score });
      }
    }

    scored.sort((a, b) => b.score - a.score || a.idx - b.idx);
    return scored.map(s => s.item);
  }

  // 3. FlexSearch 인덱스 초기화 및 빌드
  function rebuildIndex(items = []) {
    if (!items || !items.length) {
      _itemMap.clear();
      _itemDocIndex = null;
      _lastIndexedCount = 0;
      return;
    }

    const FlexSearchLib = window.FlexSearch;
    if (FlexSearchLib) {
      const Document = FlexSearchLib.Document || FlexSearchLib;
      _itemDocIndex = new Document({
        document: {
          id: 'k',
          index: ['name', 'cleanName', 'color'],
          store: false
        },
        tokenize: 'full', // 접두뿐 아니라 중간/끝 부분도 완벽 색인 (P-D60 -> D60, 60)
        cache: true,
        optimize: true
      });
    }

    _itemMap = new Map();
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      if (!it) continue;
      const rawName = it.name || it.codigo || it.itemName || '';
      if (!rawName) continue;
      const k = it.key || `${rawName}___${it.color || 'SURTIDO'}___${it.boxContent || 0}`;
      _itemMap.set(k, it);

      if (_itemDocIndex) {
        _itemDocIndex.add({
          k: k,
          name: rawName,
          cleanName: rawName.replace(/[\s_\-\/]/g, ''),
          color: it.color || ''
        });
      }
    }
    _lastIndexedCount = items.length;
    console.log(`⚡ [WmsSearchEngine] FlexSearch 인덱스 빌드 완료 (${_lastIndexedCount}개 품목)`);
  }

  // 4. 초고속 검색 질의 (0.001초 미만 완료)
  function search(query, options = {}) {
    const q = (query || '').trim().toLowerCase();
    const limit = options.limit || 20;
    const sourceItems = options.items || Array.from(_itemMap.values());

    if (!q) {
      return sourceItems.slice(0, limit);
    }

    if (_itemDocIndex && sourceItems.length !== _lastIndexedCount) {
      rebuildIndex(sourceItems);
    }

    const aliasInfo = typeof resolveModelAlias === 'function' ? resolveModelAlias(q) : null;
    const targetClean = aliasInfo ? aliasInfo.targetModel.toLowerCase().replace(/[\s_\-\/]/g, '') : null;

    let candidateItems = [];

    if (_itemDocIndex) {
      const rawResults = _itemDocIndex.search(q, { limit: limit * 4 });
      const seen = new Set();

      for (let f = 0; f < rawResults.length; f++) {
        const idList = rawResults[f].result || [];
        for (let i = 0; i < idList.length; i++) {
          const id = idList[i];
          if (!seen.has(id)) {
            seen.add(id);
            const item = _itemMap.get(id);
            if (item) candidateItems.push(item);
          }
        }
      }

      if (targetClean) {
        for (let i = 0; i < sourceItems.length; i++) {
          const it = sourceItems[i];
          const rawName = it.name || it.codigo || it.itemName || '';
          if (rawName.toLowerCase().replace(/[\s_\-\/]/g, '') === targetClean) {
            const k = it.key || `${rawName}___${it.color || 'SURTIDO'}___${it.boxContent || 0}`;
            if (!seen.has(k)) {
              seen.add(k);
              candidateItems.push(it);
            }
          }
        }
      }
    } else {
      const searchClean = q.replace(/[\s_\-\/]/g, '');
      for (let i = 0; i < sourceItems.length; i++) {
        const it = sourceItems[i];
        const rawName = (it.name || it.codigo || it.itemName || '').toLowerCase();
        const clean = rawName.replace(/[\s_\-\/]/g, '');
        const color = (it.color || '').toLowerCase();

        if (rawName.includes(q) || clean.includes(searchClean) || color.includes(q) || (targetClean && clean === targetClean)) {
          candidateItems.push(it);
        }
      }
    }

    const ranked = rankMatches(candidateItems, q);
    return ranked.slice(0, limit);
  }

  return {
    scoreItemNameMatch,
    rankMatches,
    rebuildIndex,
    search
  };
})();
window.WmsSearchEngine = WmsSearchEngine;
</script>

function loadDropdowns() {
  const select = document.getElementById('location');
  const label = document.getElementById('locationLabel');
  if (!select) return;

  const type = currentType || 'in';
  if (label) {
    label.textContent = type === 'in' ? '입고처:' : (type === 'adj' ? '조정유형/위치:' : '출고처:');
  }

  if (locationCacheByType[type] && locationCacheByType[type].length > 0) {
    select.innerHTML = '<option value="">선택</option>' + locationCacheByType[type].map(loc => `<option value="${escapeHtml(loc)}">${escapeHtml(loc)}</option>`).join('');
    return;
  }

  if (type === 'adj') {
    callServer('getOutLocations', [], {
      key: 'locations_adj',
      mode: 'latest',
      onSuccess: data => {
        const defaultAdj = ['재고조정', '치환', '추가', '간편실사', 'MAIN'];
        const merged = Array.from(new Set([...defaultAdj, ...(data || [])]));
        locationCacheByType.adj = merged;
        select.innerHTML = '<option value="">선택</option>' + merged.map(loc => `<option value="${escapeHtml(loc)}">${escapeHtml(loc)}</option>`).join('');
      },
      onError: () => {
        const fallback = ['재고조정', '치환', '추가', '간편실사', 'MAIN'];
        locationCacheByType.adj = fallback;
        select.innerHTML = '<option value="">선택</option>' + fallback.map(loc => `<option value="${escapeHtml(loc)}">${escapeHtml(loc)}</option>`).join('');
      }
    });
    return;
  }

  const serverFunc = type === 'in' ? 'getInLocations' : 'getOutLocations';
  callServer(serverFunc, [], {
    key: `locations_${type}`,
    mode: 'latest',
    onSuccess: data => {
      locationCacheByType[type] = data || [];
      select.innerHTML = '<option value="">선택</option>' + (data || []).map(loc => `<option value="${escapeHtml(loc)}">${escapeHtml(loc)}</option>`).join('');
    },
    onError: err => {
      console.error(`Failed to load ${type} locations:`, err);
      alert(`${type === 'in' ? '입고처' : '출고처'} 데이터를 불러오는 데 실패했습니다.`);
    }
  });
}

function filterItems(searchText) {
  if (!searchText.trim()) {
    hideCustomDropdown();
    return;
  }

  if (isLoadingStockData) return;

  clearTimeout(debounceTimeout);
  debounceTimeout = setTimeout(() => {
    const list = document.getElementById('itemSuggestionsList');
    if (!list) return;

    // 🚀 FlexSearch 기반 초고속 검색 & 스마트 랭킹 (0.001초 샤샤샥 엔진)
    const filteredItems = typeof WmsSearchEngine !== 'undefined'
      ? WmsSearchEngine.search(searchText, { items: stockDataCache, limit: 20 })
      : stockDataCache.filter(item => item.name.toLowerCase().includes(searchText.toLowerCase())).slice(0, 20);

    list.innerHTML = '';
    const fragment = document.createDocumentFragment();
    filteredItems.forEach(item => {
      const li = document.createElement('li');
      li.textContent = `${item.name} (${item.color}, ${item.stockBox}박스 + ${item.stockIndividual}개, 안전재고 ${item.safeStock}, 포장 ${item.boxContent}개)`;
      li.onclick = () => selectItem(item.name, item.color, item.boxContent);
      fragment.appendChild(li);
    });
    list.appendChild(fragment);

    if (filteredItems.length > 0) {
      showCustomDropdown();
    } else {
      hideCustomDropdown();
    }
  }, 50);
}

function checkItemAndStock(itemName, color, boxContent, qty, unitType, tempStockCache = stockDataCache) {
  const key = `${itemName}_${color || 'SURTIDO'}_${boxContent || 0}`;
  const item = tempStockCache.find(item => item.key === key);

  if (!item) {
    return { isRegistered: false };
  }

  if (unitType === 'box') {
    return { isRegistered: true, isSufficient: item.stockBox >= qty, boxStock: item.stockBox };
  } else {
    let totalIndividual = item.stockIndividual;
    let remainingQty = qty;
    let boxesNeeded = 0;
    let boxStock = item.stockBox;
    while (totalIndividual < remainingQty && boxStock > 0) {
      if (item.boxContent <= 0) {
        return { isRegistered: true, isSufficient: false, message: '박스당 내용물 개수가 유효하지 않습니다.' };
      }
      boxesNeeded++;
      totalIndividual += item.boxContent;
      boxStock--;
    }
    return {
      isRegistered: true,
      isSufficient: totalIndividual >= remainingQty && boxStock >= 0,
      boxStock: item.stockBox,
      individualStock: item.stockIndividual,
      boxesNeeded
    };
  }
}

function displayRecords(recordsData) {
  records = recordsData.map(record => ({
    itemName: record.itemName,
    color: record.color,
    boxQty: record.boxQty,
    individualQty: record.individualQty,
    boxContent: record.boxContent,
    location: record.location,
    unitType: record.boxQty !== 0 ? 'box' : 'individual'
  }));
  originalRecords = JSON.parse(JSON.stringify(records));
  updateTable();

  if (records.length > 0) {
    const firstLocation = records[0].location;
    const firstAdmin = recordsData[0].admin || 'ADMIN';
    const locationSelect = document.getElementById('location');
    
    if (!Array.from(locationSelect.options).some(opt => opt.value === firstLocation)) {
      const newOption = document.createElement('option');
      newOption.value = firstLocation;
      newOption.text = firstLocation;
      locationSelect.add(newOption);
    }

    document.getElementById('adminInput').value = firstAdmin;
  } else {
    document.getElementById('location').value = '';

function addRecord() {
  const checkedRadio = document.querySelector('input[name="recordType"]:checked');
  currentType = checkedRadio ? checkedRadio.value : 'in';
  const unitType = document.querySelector('input[name="unitType"]:checked').value;
  const qty = parseInt(document.getElementById('qty').value) || 0;
  const itemName = document.getElementById('itemName').value.trim();
  const color = document.getElementById('color').value;
  const boxContent = parseInt(document.getElementById('boxContent').value) || 0;
  const location = document.getElementById('location').value;

  if (!itemName || !location || (!qty && unitType === 'box') || (!qty && unitType === 'individual')) {
    alert('필수 항목(품명, 입출고처, 수량)을 입력하세요.');
    return;
  }

  const stockInfo = checkItemAndStock(itemName, color, boxContent, qty, unitType);
  if (!stockInfo.isRegistered) {
    const confirmRegister = confirm('등록되지 않은 상품입니다. 상품을 등록하시겠습니까?');
    if (confirmRegister) {
      const currentData = { itemName, color, boxContent, qty, unitType, location, type: currentType };
      sessionStorage.setItem('pendingData', JSON.stringify(currentData));
      setPage('상품등록', currentData);
    }
    return;
  }

  if (currentType === 'out' && !stockInfo.isSufficient) {
    showStockWarningModal(qty, unitType === 'box' ? stockInfo.boxStock : stockInfo.individualStock, unitType === 'box' ? '박스' : '낱개');
    return;
  }

  const formData = {
    itemName,
    color,
    boxQty: unitType === 'box' ? (currentType === 'out' ? -qty : qty) : 0,
    individualQty: unitType === 'individual' ? (currentType === 'out' ? -qty : qty) : 0,
    boxContent,
    location,
    unitType
  };
  if (currentType === 'out' && unitType === 'individual') {
    const proceed = confirm('낱개출고입니다. 진행할까요?');
    if (!proceed) {
      return;
    }
  }
  records.push(formData);
  updateTable();
  clearForm();
  toggleScroll();
  updateTotals();
}

function handleEditableFocus(el, e) {
  if (e) e.stopPropagation();
  const container = document.getElementById('scrollableTable');
  const prevLeft = container ? container.scrollLeft : 0;
  const prevTop = container ? container.scrollTop : 0;

  requestAnimationFrame(() => {
    if (container) {
      container.scrollLeft = prevLeft;
      container.scrollTop = prevTop;
    }
    try {
      const selection = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(el);
      selection.removeAllRanges();
      selection.addRange(range);
    } catch (err) {}
  });
}

// 재고조정 전표는 부호 있는 증감(Δ)이므로 부호를 유지해 표시한다.
function qtyForDisplay(v) {
  const typeRadio = document.querySelector('input[name="recordType"]:checked');
  const n = Number(v) || 0;
  return typeRadio && typeRadio.value === 'adj' ? n : Math.abs(n);
}

function handleEditableKeyDown(e, el, idx, field) {
  if (e.key === 'Enter') {
    e.preventDefault();
    el.blur();
  } else if (e.key === 'Escape') {
    e.preventDefault();
    if (records && records[idx]) {
      el.textContent = qtyForDisplay(records[idx][field]);
    }
    el.blur();
  }
}

function updateTable() {
  const tbody = document.getElementById('tableBody');
  let html = '';
  records.forEach((rec, idx) => {
    html += `
      <tr>
        <td><input type="checkbox" class="rowCheckbox" data-index="${idx}"></td>
        <td>${escapeHtml(rec.itemName)}</td>
        <td>${escapeHtml(rec.color)}</td>
        <td contenteditable="true" tabindex="0" class="editable" onmousedown="event.stopPropagation()" onclick="event.stopPropagation()" ondblclick="event.stopPropagation()" onfocus="handleEditableFocus(this, event)" onkeydown="handleEditableKeyDown(event, this, ${idx}, 'boxQty')" onblur="updateRecord(${idx}, 'boxQty', this.textContent)">${qtyForDisplay(rec.boxQty)}</td>
        <td contenteditable="true" tabindex="0" class="editable" onmousedown="event.stopPropagation()" onclick="event.stopPropagation()" ondblclick="event.stopPropagation()" onfocus="handleEditableFocus(this, event)" onkeydown="handleEditableKeyDown(event, this, ${idx}, 'individualQty')" onblur="updateRecord(${idx}, 'individualQty', this.textContent)">${qtyForDisplay(rec.individualQty)}</td>
        <td>${rec.boxContent}</td>
        <td>${escapeHtml(rec.location)}</td>
      </tr>
    `;
  });
  tbody.innerHTML = html;
}

function updateRecord(index, field, value) {
  if (index < 0 || index >= records.length) return;
  const typeRadio = document.querySelector('input[name="recordType"]:checked');
  const type = typeRadio ? typeRadio.value : 'out';
  const numVal = parseInt(value) || 0;
  const targetVal = type === 'out' ? -numVal : numVal;

  if (records[index][field] === targetVal) {
    return; // 변경 사항 없으면 재렌더링 차단
  }

  records[index][field] = targetVal;
  if (records[index].boxQty !== 0) {
    records[index].unitType = 'box';
  } else {
    records[index].unitType = 'individual';
  }
  updateTable();
  updateTotals();
  toggleScroll();
}

  document.getElementById('qty').value = '';
}

function toggleScroll() {

function updateTotals() {
  const totalItems = records.length;
  const totalBoxes = records.reduce((sum, rec) => sum + Math.abs(rec.boxQty), 0);
  const totalIndividuals = records.reduce((sum, rec) => sum + Math.abs(rec.individualQty), 0);
  document.getElementById('totalItems').textContent = totalItems;
  document.getElementById('totalBoxesLabel').textContent = `Total Boxes: ${totalBoxes}`;
  document.getElementById('totalIndividualsLabel').textContent = `Total Individuals: ${totalIndividuals}`;
}

function updateRecords() {
  const checkedRadio = document.querySelector('input[name="recordType"]:checked');
  const typeValue = checkedRadio ? checkedRadio.value : 'in';
  const type = typeValue === 'in' ? '입고' : (typeValue === 'adj' ? '재고조정' : '출고');
  const invoiceNumber = document.getElementById('invoiceNumber').value;
  const date = document.getElementById('searchDate').value;
  const fullInvoiceNumber = `${date.replace(/-/g, '/')}-${invoiceNumber.padStart(3, '0')}`;
  const adminValue = document.getElementById('adminInput').value;
  const loadedInvoiceNumber = document.getElementById('loadedInvoiceNumber').textContent;
if (invoiceNumber.padStart(3, '0') !== loadedInvoiceNumber) {
    alert('로드값과 변경값이 틀립니다.');
    return;
  }
  // 업데이트 처리 중 UI 피드백
  const buttonContainer = document.querySelector('.submit').parentNode;
  const originalButton = document.querySelector('.submit');
  originalButton.style.visibility = 'hidden';
  const processingButton = document.createElement('div');
  processingButton.className = 'processing-button';
  processingButton.textContent = '처리 중...';
  buttonContainer.appendChild(processingButton);

  // 레코드가 없을 경우 삭제 처리
  if (records.length === 0) {
    const confirmDelete = confirm(`${date} ${invoiceNumber}번 ${type}를 삭제하시겠습니까?`);
    if (confirmDelete) {
      callServer('updatePendingRecords', [fullInvoiceNumber, type, [], adminValue], {
        key: 'updateRecords',
        timeout: 90000,
        onSuccess: () => {
          alert('레코드가 성공적으로 삭제되었습니다.');
          loadStockData(true); // 즉시 백그라운드 재고 갱신
          records = [];
          updateTable();
          updateTotals();
          toggleScroll();
          originalButton.style.visibility = 'visible';
          buttonContainer.removeChild(processingButton);
        },
        onError: err => {
          alert('삭제 실패: ' + err.message);
          originalButton.style.visibility = 'visible';
          buttonContainer.removeChild(processingButton);
        }
      });
    } else {
      originalButton.style.visibility = 'visible';
      buttonContainer.removeChild(processingButton);
    }
    return;
  }

  // 재고 검증을 위한 임시 재고 캐시 생성
  let tempStockCache = JSON.parse(JSON.stringify(stockDataCache)); // 깊은 복사
  if (typeValue === 'out' && originalRecords.length > 0) {
    // 기존 레코드의 재고 반환 시뮬레이션
    originalRecords.forEach(record => {
      const key = `${record.itemName}_${record.color || 'SURTIDO'}_${record.boxContent || 0}`;
      const item = tempStockCache.find(item => item.key === key);
      if (item) {
        // 출고 레코드 삭제 시 재고 증가
        item.stockBox += Math.abs(record.boxQty);
        item.stockIndividual += Math.abs(record.individualQty);
      }
    });
  }

  // 새 레코드에 대해 재고 검증
  if (typeValue === 'out') {
    for (const record of records) {
      const bQty = Math.abs(record.boxQty) || 0;
      const iQty = Math.abs(record.individualQty) || 0;

      if (bQty > 0) {
        const boxInfo = checkItemAndStock(
          record.itemName,
          record.color,
          record.boxContent,
          bQty,
          'box',
          tempStockCache
        );
        if (!boxInfo.isSufficient) {
          alert(`박스 재고 부족: ${record.itemName} (${record.color}) - 필요: ${bQty}박스`);
          originalButton.style.visibility = 'visible';
          buttonContainer.removeChild(processingButton);
          return;
        }
      }

      if (iQty > 0) {
        const indInfo = checkItemAndStock(
          record.itemName,
          record.color,
          record.boxContent,
          iQty,
          'individual',
          tempStockCache
        );
        if (!indInfo.isSufficient) {
          alert(`낱개 재고 부족: ${record.itemName} (${record.color}) - 필요: ${iQty}개`);
          originalButton.style.visibility = 'visible';
          buttonContainer.removeChild(processingButton);
          return;
        }
      }
    }
  }

  // 새 레코드로 업데이트
  const recordsToPrint = [...records];
  callServer('updatePendingRecords', [fullInvoiceNumber, type, records, adminValue], {
    key: 'updateRecords',
    timeout: 90000,
    onSuccess: () => {
      alert('레코드가 성공적으로 업데이트되었습니다.');
      loadStockData(true); // ★ 핵심: 인쇄 대기 없이 백그라운드에서 즉시 재고 갱신 시작!
      printReceipt(recordsToPrint, typeValue, date, adminValue, fullInvoiceNumber, () => {
        records = [];
        updateTable();
        updateTotals();
        toggleScroll();
        originalButton.style.visibility = 'visible';
        buttonContainer.removeChild(processingButton);
        loadStockData(true); // 인쇄 콜백 완료 후 재확인
      });
    },
    onError: err => {
      alert('업데이트 실패: ' + err.message);
      originalButton.style.visibility = 'visible';
      buttonContainer.removeChild(processingButton);
    }
  });
}


function showCustomDropdown() {
  const dropdown = document.getElementById('customDropdown');
  const input = document.getElementById('itemName');
  if (!dropdown || !input) return;
  const rect = input.getBoundingClientRect();
  dropdown.style.display = 'block';
  dropdown.style.top = `${rect.bottom + window.scrollY}px`;
  dropdown.style.left = `${rect.left + window.scrollX}px`;
  dropdownVisible = true;
}

function hideCustomDropdown() {
  const dropdown = document.getElementById('customDropdown');
  if (dropdown) {
    dropdown.style.display = 'none';
    dropdownVisible = false;
  }
}

function selectItem(name, color, boxContent) {
  document.getElementById('itemName').value = name;
  document.getElementById('color').value = color || 'SURTIDO';
  document.getElementById('boxContent').value = boxContent || '';
  hideCustomDropdown();
}

function autoFillColor() {
  const itemNameInput = document.getElementById('itemName');
  if (!itemNameInput) return;
  const val = itemNameInput.value.trim();
  const matched = stockDataCache.find(item => item.name === val || item.key === val);
  if (matched) {
    itemNameInput.value = matched.name;
    const colorInput = document.getElementById('color');
    const boxContentInput = document.getElementById('boxContent');
    if (colorInput) colorInput.value = matched.color || 'SURTIDO';
    if (boxContentInput) boxContentInput.value = matched.boxContent || '';
  }
}

function setupDropdownEvents() {
  const itemNameInput = document.getElementById('itemName');
  if (itemNameInput) {
    itemNameInput.addEventListener('blur', () => setTimeout(hideCustomDropdown, 100));
  }
  document.addEventListener('click', (e) => {
    const dropdown = document.getElementById('customDropdown');
    const itemName = document.getElementById('itemName');
    if (dropdown && itemName && !itemName.contains(e.target) && !dropdown.contains(e.target)) {
      hideCustomDropdown();
    }
  });
}

function incrementInvoice() {
  const currentSeq = parseInt(document.getElementById('invoiceNumber').value);
  if (isNaN(currentSeq)) return;
  const date = document.getElementById('searchDate').value;
  const checkedRadio = document.querySelector('input[name="recordType"]:checked');
  const typeValue = checkedRadio ? checkedRadio.value : 'in';
  const type = typeValue === 'in' ? '입고' : (typeValue === 'adj' ? '재고조정' : '출고');
  callServer('getMaxSequentialNumber', [date, type], {
    key: 'maxSeq',
    mode: 'latest',
    onSuccess: maxSeq => {
      if (currentSeq < maxSeq) {
        document.getElementById('invoiceNumber').value = String(currentSeq + 1).padStart(3, '0');
      } else {
        alert(`선택한 ${type} 전표는 없습니다`);
      }
    },
    onError: err => alert('영수증 번호 조회 실패: ' + (err && err.message ? err.message : err))
  });
}

function decrementInvoice() {
  const currentSeq = parseInt(document.getElementById('invoiceNumber').value);
  const checkedRadio = document.querySelector('input[name="recordType"]:checked');
  const typeValue = checkedRadio ? checkedRadio.value : 'in';
  const type = typeValue === 'in' ? '입고' : (typeValue === 'adj' ? '재고조정' : '출고');
  if (isNaN(currentSeq) || currentSeq <= 1) {
    alert(`선택한 ${type} 전표는 없습니다`);
    return;
  }
  document.getElementById('invoiceNumber').value = String(currentSeq - 1).padStart(3, '0');
}

function toggleSelectAll() {
  const selectAll = document.getElementById('selectAll').checked;
  document.querySelectorAll('.rowCheckbox').forEach(cb => cb.checked = selectAll);
}

}
