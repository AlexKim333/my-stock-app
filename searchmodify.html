<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <script type="module" src="/src/wms-entry.js"></script>

<style id="mobileOptimizationSearchModify">
/* 📱 SearchModify 모바일 반응형 완벽 최적화 */

  html, body {
    width: 100% !important;
    max-width: 100vw !important;
    height: auto !important;
    min-height: 100vh !important;
    min-height: 100dvh !important;
    overflow-x: hidden !important;
    overflow-y: auto !important;
    background: #f8fafc !important;
    -webkit-text-size-adjust: 100% !important;
  }

  .container {
    width: 100% !important;
    max-width: 100vw !important;
    height: auto !important;
    min-height: 100vh !important;
    display: flex !important;
    flex-direction: column !important;
    overflow-x: hidden !important;
  }

  .banner {
    width: 100% !important;
    height: auto !important;
    padding: 10px 12px !important;
    font-size: 11pt !important;
    gap: 8px !important;
  }

  .banner-row {
    flex-direction: column !important;
    align-items: stretch !important;
    gap: 8px !important;
    width: 100% !important;
  }

  .banner-row.second {
    flex-direction: column !important;
    align-items: stretch !important;
    gap: 8px !important;
    width: 100% !important;
  }

  .content {
    width: 100% !important;
    max-width: 100vw !important;
    flex-direction: column !important;
    height: auto !important;
  }

  .menu {
    width: 100% !important;
    min-width: 0 !important;
    flex-direction: row !important;
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch !important;
    padding: 8px 10px !important;
    gap: 8px !important;
    border-right: none !important;
    border-bottom: 1px solid #cbd5e1 !important;
  }

  .menu button {
    width: auto !important;
    margin-bottom: 0 !important;
    padding: 8px 16px !important;
    border-radius: 20px !important;
    font-size: 9.5pt !important;
    font-weight: 700 !important;
    white-space: nowrap !important;
    flex: 0 0 auto !important;
  }

  .input-area {
    width: 100% !important;
    flex-direction: column !important;
    height: auto !important;
    padding: 10px !important;
    gap: 12px !important;
    overflow: visible !important;
  }

  .input-section {
    width: 100% !important;
    flex: none !important;
  }

  .table-section {
    width: 100% !important;
    flex: none !important;
    overflow: visible !important;
  }

  .scrollable-table {
    width: 100% !important;
    max-height: 380px !important;
    overflow-x: auto !important;
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch !important;
  }

  .scrollable-table table {
    min-width: 600px !important;
  }

  select, input[type="text"], input[type="number"], input[type="date"] {
    width: 100% !important;
    font-size: 16px !important;
    height: 40px !important;
    box-sizing: border-box !important;
    border-radius: 8px !important;
  }

  .input-row {
    display: flex !important;
    flex-direction: column !important;
    align-items: flex-start !important;
    gap: 4px !important;
    margin-bottom: 12px !important;
  }

  .input-row label {
    width: 100% !important;
    font-weight: 700 !important;
  }
}
</style>

  <!-- 🚀 FlexSearch 초고속 전문 검색엔진 탑재 -->
  <script src="https://cdn.jsdelivr.net/npm/flexsearch@0.8.212/dist/flexsearch.bundle.min.js"></script>
  <style>
    :root {
      --primary-color: #4CAF50;
      --submit-color: #2196F3;
      --banner-color: #ede9fe;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
      padding: 0;
      margin: 0;
      background-color: #f8fafc;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    .banner {
      width: 100%;
      border-bottom: 1.5px solid #c7d2fe;
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-color: var(--banner-color);
      flex-shrink: 0;
    }
    .banner-row { 
      display: flex; 
      flex-direction: row; 
      align-items: center; 
      gap: 12px; 
      width: 100%; 
      flex-wrap: nowrap;
    }
    .banner-row.second { 
      justify-content: flex-start;
      align-items: center;
      gap: 16px;
    }
    #formTitle {
      font-size: 11.5pt;
      font-weight: 800;
      color: #3730a3;
      white-space: nowrap;
      flex-shrink: 0;
      margin-right: 4px;
      letter-spacing: -0.3px;
    }
    .banner label {
      display: inline-flex;
      align-items: center;
      width: auto !important;
      margin-right: 4px !important;
      font-size: 9.5pt;
      font-weight: 700;
      color: #1e1b4b;
      white-space: nowrap;
    }
    .banner input[type="text"],
    .banner input[type="date"] {
      height: 30px !important;
      padding: 3px 8px !important;
      font-size: 9.5pt !important;
      border: 1.5px solid #cbd5e1 !important;
      border-radius: 6px !important;
      background: #ffffff !important;
    }
    #searchDate { width: 130px !important; }
    #invoiceNumber { width: 65px !important; text-align: center; font-weight: 800; color: #1e293b; }
    #adminInput { width: 90px !important; text-align: center; font-weight: 700; }
    #loadedOrigin {
      display: inline-block;
      min-width: 70px;
      text-align: center;
      font-size: 10pt;
      font-weight: 800;
      color: #b45309;
      background: #fffbeb;
      border: 1px solid #fde68a;
      padding: 2px 8px;
      border-radius: 6px;
    }
    #loadedInvoiceNumber {
      display: inline-block;
      min-width: 42px;
      text-align: center;
      font-size: 10pt;
      font-weight: 800;
      color: #1d4ed8;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .banner-row.second button {
      padding: 5px 16px;
      height: 30px;
      background-color: #059669;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 9.5pt;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s;
    }
    .banner-row.second button:hover {
      background-color: #047857;
    }
    .banner-row.second button.btn-reprint { background-color: #2563eb; }
    .banner-row.second button.btn-reprint:hover { background-color: #1d4ed8; }
    .banner-row.second button.btn-return { background-color: #c2410c; }
    .banner-row.second button.btn-return:hover { background-color: #9a3412; }
    #loadedReturnOf { display: none; font-size: 9pt; font-weight: 800; color: #c2410c; background: #fff7ed; border: 1px solid #fdba74; border-radius: 6px; padding: 3px 8px; }
    #returnModalBackdrop { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); z-index: 1100; align-items: flex-start; justify-content: center; padding: 40px 12px; overflow-y: auto; }
    #returnModal { background: #ffffff; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); width: 100%; max-width: 820px; padding: 16px 18px; font-size: 9.5pt; }
    #returnModal h3 { margin: 0 0 6px; font-size: 12pt; color: #9a3412; }
    #returnModal .ret-meta { color: #475569; margin-bottom: 10px; line-height: 1.6; }
    #returnModal .ret-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
    #returnModal .ret-controls label { font-weight: 700; color: #334155; }
    #returnModal .ret-controls select, #returnModal .ret-controls input[type=text] { padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 9.5pt; }
    #returnModal table { width: 100%; border-collapse: collapse; }
    #returnModal th, #returnModal td { padding: 5px 6px; border-bottom: 1px solid #e2e8f0; text-align: right; white-space: nowrap; }
    #returnModal th:nth-child(-n+2), #returnModal td:nth-child(-n+2) { text-align: left; }
    #returnModal th { background: #f1f5f9; position: static; }
    #returnModal td input { width: 64px; padding: 3px 4px; text-align: right; border: 1px solid #cbd5e1; border-radius: 4px; }
    #returnModal tr.ret-done td { color: #94a3b8; }
    #returnModal .ret-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    #returnModal .ret-actions button { padding: 6px 14px; border-radius: 6px; border: none; font-weight: 700; cursor: pointer; }
    #returnModal .ret-actions .ret-submit { background: #c2410c; color: #fff; }
    #returnModal .ret-actions .ret-submit:disabled { background: #fdba74; cursor: default; }
    #returnModal .ret-actions .ret-cancel { background: #e2e8f0; color: #334155; }
    #returnModal .ret-status { margin-top: 8px; font-weight: 700; color: #475569; min-height: 1.2em; }
    .radio-group {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #ffffff;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1.5px solid #ddd6fe;
      flex-shrink: 0;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .radio-group label {
      font-size: 9pt !important;
      font-weight: 700 !important;
      color: #334155;
      margin: 0 !important;
      cursor: pointer;
      display: inline-flex !important;
      align-items: center;
      gap: 4px;
    }
    .arrow-buttons {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      flex-shrink: 0;
    }
    .arrow-buttons button {
      width: 28px;
      height: 28px;
      font-size: 11pt;
      padding: 0;
      border: 1px solid #16a34a;
      border-radius: 5px;
      background-color: #22c55e;
      color: white;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      transition: background 0.15s;
    }
    .arrow-buttons button:hover {
      background-color: #16a34a;
    }
    .content {
      flex: 1;
      display: flex;
      width: 100%;
      min-height: 0;
      overflow: hidden;
    }
    .menu {
      width: 110px;
      padding: 10px 8px;
      background-color: #f1f5f9;
      border-right: 1px solid #cbd5e1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .menu button {
      width: 100%;
      padding: 8px 6px;
      margin-bottom: 0;
      background-color: #64748b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 9pt;
      font-weight: 700;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .menu button:hover, .menu button.active {
      background-color: #3b82f6;
    }
    .input-area {
      flex: 1;
      min-width: 0;
      padding: 12px 16px;
      display: flex;
      flex-direction: row;
      gap: 16px;
      height: 100%;
      overflow: hidden;
    }
    .input-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .input-section {
      flex: 0 0 310px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .table-section {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .form-group { margin-bottom: 12px; }
    .input-section label {
      display: inline-block;
      width: 95px;
      margin-right: 6px;
      font-size: 9.5pt;
      font-weight: 700;
      color: #334155;
    }
    .input-section select,
    .input-section input[type="text"],
    .input-section input[type="number"] {
      width: 190px;
      height: 32px;
      padding: 4px 8px;
      font-size: 9.5pt;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }
    .input-row { margin-bottom: 8px; display: flex; align-items: center; }
    .unit-options { margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
    .unit-options label { width: auto !important; margin-right: 0 !important; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      border: 1px solid #ddd;
      padding: 6px 8px;
      text-align: center;
      font-size: 9.5pt;
    }
    th { 
      background-color: #f1f5f9; 
      color: #1e293b;
      font-weight: 700;
      height: 36px; 
      position: sticky; 
      top: 0; 
      z-index: 1; 
    }
    td { height: 36px; }
    .scrollable-table {
      overflow-y: hidden;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      flex: 1;
    }
    .scrollable-table.scroll-enabled { 
      max-height: 420px;
      overflow-y: auto;
    }
    .buttons { margin-bottom: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button {
      padding: 7px 16px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 9.5pt;
      font-weight: 700;
      transition: background 0.15s;
    }
    button.submit { background-color: var(--submit-color); }
    button:hover { background-color: #45a049; }
    button.submit:hover { background-color: #0284c7; }
    .total-label { margin-left: 8px; font-size: 9pt; font-weight: 700; color: #475569; }
    .dropdown-container {
      background-color: white;
      border: 1px solid #ddd;
      max-height: 200px;
      overflow-y: auto;
      z-index: 10;
      width: 400px;
      margin-top: 0;
      position: absolute;
      left: 110px;
    }
    .dropdown-container ul { list-style: none; padding: 0; margin: 0; }
    .dropdown-container li { padding: 5px 10px; font-size: 10pt; cursor: pointer; }
    .dropdown-container li:hover { background-color: #f0f0f0; }
    .editable {
      background-color: #fff;
      cursor: text;
      box-sizing: border-box !important;
      transition: none !important;
      line-height: 1.4;
      vertical-align: middle;
      user-select: text;
    }
    .editable:focus {
      outline: none !important;
      box-shadow: inset 0 0 0 1.5px var(--submit-color, #0284c7) !important;
      background-color: #ffffff !important;
      caret-color: var(--submit-color, #0284c7);
    }
    tr:hover td.editable:focus {
      background-color: #ffffff !important;
    }
    #printFrame { display: none; }
    .processing-button {
      background-color: #add8e6;
      color: #666;
      cursor: default;
      opacity: 0.7;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .button-container {
      position: relative;
      display: inline-block;
    }
    #stockWarningModal {
      display: none;
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translate(-50%, 0);
      background-color: white;
      padding: 20px;
      border: 1px solid #ccc;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      z-index: 1000; /* 테이블 헤더(z-index: 1)보다 높게 설정 */
      width: 80%;
      max-width: 400px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="banner">
      <div class="banner-row">
        <div id="formTitle">🔍 검색수정</div>
        <div class="radio-group">
          <label><input type="radio" name="recordType" value="in" checked> 입고</label>
          <label><input type="radio" name="recordType" value="out"> 출고</label>
          <label><input type="radio" name="recordType" value="adj"> 재고조정</label>
        </div>
        <div class="input-group">
          <label for="searchDate">날짜:</label>
          <input type="date" id="searchDate" name="searchDate">
        </div>
        <div class="input-group">
          <label for="invoiceNumber">영수증 번호:</label>
          <input type="text" id="invoiceNumber" name="invoiceNumber">
        </div>
        <div class="arrow-buttons">
          <button type="button" onclick="decrementInvoice()" title="이전 영수증">◀</button>
          <button type="button" onclick="incrementInvoice()" title="다음 영수증">▶</button>
        </div>
      </div>
      <div class="banner-row second">
        <div class="input-group" title="불러온 전표의 창고 (출고·이동: 출발 창고 / 입고: 도착 창고)">
          <label id="loadedOriginLabel">ORIGEN:</label>
          <span id="loadedOrigin">-</span>
        </div>
        <div class="input-group">
          <label for="adminInput">관리자:</label>
          <input type="text" id="adminInput" name="adminInput" value="ADMIN">
        </div>
        <div class="input-group">
          <label>로드 영수증:</label>
          <span id="loadedInvoiceNumber">000</span>
        </div>
        <button type="button" onclick="searchRecords()">🔍 전표 검색</button>
        <button type="button" class="btn-reprint" onclick="reprintReceipt()" title="장바구니에 있는 전표를 기존 양식으로 다시 출력">🖨️ 전표 재발행</button>
        <button type="button" class="btn-return" id="btnOpenReturn" style="display:none;" onclick="openReturnModal()" title="원 출고 전표는 그대로 두고 반품을 새 입고 전표로 기록">↩️ 반품 입고</button>
        <span id="loadedReturnOf"></span>
      </div>
    </div>
    <div class="content">
      <div class="menu">
        <button onclick="setPage('입고입력')">입고입력</button>
        <button onclick="setPage('출고입력')">출고입력</button>
        <button onclick="setPage('상품등록')">상품등록</button>
        <button onclick="setPage('검색수정')" class="active">검색수정</button>
      </div>
      <div class="input-area">
        <div class="input-section">
          <div class="form-group" id="formInputs">
            <div class="input-row">
              <label id="locationLabel">입고처:</label>
              <select id="location" name="location" tabindex="1">
                <option value="">선택</option>
              </select>
            </div>
            <div class="unit-options">
              <label><input type="radio" name="unitType" value="box" checked onchange="updateUnitType()"> 상자</label>
              <label><input type="radio" name="unitType" value="individual" onchange="updateUnitType()"> 낱개</label>
            </div>
            <div class="input-row">
              <label for="itemName">품명:</label>
              <input type="text" id="itemName" name="itemName" autocomplete="off" 
                     oninput="filterItems(this.value)" onchange="autoFillColor()" tabindex="2">
              <div id="customDropdown" class="dropdown-container" style="display: none;">
                <ul id="itemSuggestionsList"></ul>
              </div>
            </div>
            <div class="input-row">
              <label for="color">색상:</label>
              <input type="text" id="color" name="color">
            </div>
            <div class="input-row">
              <label id="qtyLabel">수량:</label>
              <input type="number" id="qty" name="qty" tabindex="4">
            </div>
            <div class="input-row">
              <label for="boxContent">박스당 내용물 개수:</label>
              <input type="text" id="boxContent" name="boxContent">
            </div>
          </div>
        </div>
        <div class="table-section">
          <div class="buttons">
            <button onclick="addRecord()">Add</button>
            <button onclick="deleteRecord()">Delete</button>
            <button class="submit" onclick="updateRecords()">Update</button>
            <span class="total-label">Total Items: <span id="totalItems">0</span></span>
            <span class="total-label" id="totalBoxesLabel">Total Boxes: 0</span>
            <span class="total-label" id="totalIndividualsLabel">Total Individuals: 0</span>
          </div>
          <div class="scrollable-table" id="scrollableTable">
            <table id="recordTable">
              <thead id="tableHeader">
                <tr>
                  <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll()"></th>
                  <th>Item Name</th>
                  <th>Color</th>
                  <th>Box Quantity</th>
                  <th>Individual Quantity</th>
                  <th>Quantity per Box</th>
                  <th>Location</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <div id="stockWarningModal">
      <h3>재고 부족 경고</h3>
      <p id="warningMessage"></p>
      <button onclick="closeStockWarningModal()">닫기</button>
    </div>
    <div id="returnModalBackdrop">
      <div id="returnModal" role="dialog" aria-labelledby="returnModalTitle">
        <h3 id="returnModalTitle">↩️ 반품 입고</h3>
        <div class="ret-meta" id="returnMeta">불러오는 중...</div>
        <div class="ret-controls">
          <label for="returnWarehouse">반품받을 창고</label>
          <select id="returnWarehouse"><option value="MAIN">MAIN</option></select>
          <label for="returnMemo">메모</label>
          <input type="text" id="returnMemo" maxlength="200" placeholder="반품 사유 (선택)" style="flex:1; min-width:160px;">
        </div>
        <div style="max-height:50vh; overflow-y:auto;">
          <table>
            <thead>
              <tr>
                <th>품명</th><th>컬러</th><th>입수</th><th>출고</th><th>반품됨</th><th>남음</th><th>반품 상자</th><th>반품 낱개</th>
              </tr>
            </thead>
            <tbody id="returnLines"></tbody>
          </table>
        </div>
        <div class="ret-status" id="returnStatus"></div>
        <div class="ret-actions">
          <button type="button" class="ret-cancel" onclick="closeReturnModal()">닫기</button>
          <button type="button" class="ret-submit" id="returnSubmit" onclick="submitReturn()">반품 기록</button>
        </div>
      </div>

    <iframe id="printFrame" style="display: none;"></iframe>

<script>
// =====================================================================
// WarehouseApp / SearchModify 두 다이얼로그가 공유하는 로직
// ---------------------------------------------------------------------
// 이전에는 loadStockData / printReceipt가 파일별로 복제되어 있었고,
// 한쪽만 수정되는 일이 반복됐다 (예: 인쇄 콜백 미실행 시 커밋 후 장바구니
// 미정리 → 재전송 위험). 두 화면의 공통 뼈대만 이 파일에 두고,
// 화면별로 다른 부분은 호출부가 콜백으로 주입한다.
// =====================================================================

// =====================================================================
// HTML 이스케이프
// ---------------------------------------------------------------------
// 품명·색상·거래처명은 구글 시트에서 오고 작업자가 직접 타이핑하기도 한다.
// 따옴표나 꺾쇠가 섞이면 innerHTML로 조립한 마크업이 깨지거나 주입된다.
// =====================================================================

/** 텍스트 및 속성값용. 0이나 false도 문자열로 보존한다. */
function escapeHtml(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

/**
 * 인라인 핸들러의 인자용. `onclick="fn(${jsArg(name)})"` 형태로 쓰고,
 * 호출부에서 따옴표를 직접 붙이지 않는다.
 *
 * JSON으로 인코딩해 JS 문자열 리터럴을 만든 뒤 HTML 이스케이프하므로,
 * 작은따옴표(L'AMOUR)·큰따옴표·백슬래시가 모두 안전하다. 예전에는
 * `onclick="fn('${name.replace(/'/g, "\\'")}')"` 처럼 작은따옴표만 막아서
 * 큰따옴표가 들어오면 속성이 조기 종료돼 마크업이 깨졌다.
 */
function jsArg(value) {
  return escapeHtml(JSON.stringify(value === undefined ? null : value));
}

// =====================================================================
// 서버 호출 공통 경로
// ---------------------------------------------------------------------
// google.script.run은 취소도 타임아웃도 제공하지 않으므로, 호출 지점마다
// 손으로 가드를 만들어 왔다. 그 결과 재진입 가드·타임아웃·응답 순서 보장이
// 호출부마다 제각각이었고(타임아웃은 19곳 중 1곳에만 존재), 같은 종류의
// 버그가 기능을 추가할 때마다 재발했다. 모든 서버 호출은 이 함수를 통한다.
// =====================================================================

// key -> 그 key에서 유효한 최신 토큰. 토큰은 전역 단조 증가라 재사용되지 않는다.
const _serverCallTokens = Object.create(null);
let _serverCallSeq = 0;

/**
 * @param {string}   fnName            호출할 서버 함수명 (Code.js의 전역 함수)
 * @param {Array}    args              인자 배열
 * @param {Object}   opt
 * @param {string}   opt.key           동시성 그룹. 기본값은 fnName.
 * @param {string}   opt.mode          'block'  진행 중이면 새 호출을 무시 (기본, 쓰기 작업용)
 *                                     'latest' 새 호출이 이전 호출을 무효화 (읽기/검색용)
 * @param {number}   opt.timeout       ms. 0이면 무제한. 기본 30000.
 * @param {Function} opt.onSuccess     (result) => void
 * @param {Function} opt.onError       (error) => void
 * @param {Function} opt.onSettled     성공·실패·타임아웃 후 항상 실행 (버튼 복구 등).
 *                                     단, 무효화된 응답에서는 실행되지 않는다.
 * @param {Function} opt.onBusy        mode 'block'에서 호출이 차단됐을 때
 * @returns {boolean} 호출이 실제로 전송됐는지
 */
function callServer(fnName, args, opt) {
  const o = opt || {};
  const key = o.key || fnName;
  const mode = o.mode === 'latest' ? 'latest' : 'block';
  const timeout = o.timeout === 0 ? 0 : (o.timeout || 30000);

  if (mode === 'block' && _serverCallTokens[key] != null) {
    console.warn(`[callServer] '${key}' 진행 중 — 중복 요청 무시`);
    if (typeof o.onBusy === 'function') o.onBusy();
    else if (typeof o.onError === 'function') {
      o.onError(new Error('이전 요청이 아직 처리 중입니다. 중복 제출을 막기 위해 잠시 기다려 주세요.'));
    }
    return false;
  }

  const token = ++_serverCallSeq;
  _serverCallTokens[key] = token;

  let timer = null;
  let settled = false;
  let timedOut = false;

  const finish = (ok, payload, isTimeout) => {
    // 취소되거나 더 새로운 호출에 추월된 응답은 폐기한다.
    if (_serverCallTokens[key] !== token && !timedOut) return;

    // 타임아웃 이후 실제 응답: 토큰만 해제하고 재시도 이중 커밋을 막는다.
    if (timedOut && !isTimeout) {
      delete _serverCallTokens[key];
      if (ok) {
        console.warn(`[callServer] ${fnName} 타임아웃 이후 성공 — 이미 커밋됐을 수 있으니 재시도하지 마세요.`);
        if (typeof o.onLateSuccess === 'function') o.onLateSuccess(payload);
      } else {
        console.warn(`[callServer] ${fnName} 타임아웃 이후 실패:`, payload);
      }
      return;
    }

    if (settled) return;
    settled = true;
    if (timer) { clearTimeout(timer); timer = null; }

    if (isTimeout) {
      timedOut = true;
    } else {
      delete _serverCallTokens[key];
    }

    try {
      if (ok) {
        if (typeof o.onSuccess === 'function') o.onSuccess(payload);
      } else {
        if (typeof o.onError === 'function') o.onError(payload);
        else console.error(`[callServer] ${fnName} 실패:`, payload);
      }
    } finally {
      if (typeof o.onSettled === 'function') {
        try { o.onSettled(); } catch (e) { console.warn('[callServer] onSettled 오류:', e); }
      }
    }
  };

  if (timeout > 0) {
    timer = setTimeout(
      () => finish(false, new Error(`서버 응답 시간 초과 (${Math.round(timeout / 1000)}초): ${fnName}`), true),
      timeout
    );
  }

  const runner = google.script.run
    .withSuccessHandler(res => finish(true, res))
    .withFailureHandler(err => finish(false, err));

  if (typeof runner[fnName] !== 'function') {
    finish(false, new Error(`서버 함수를 찾을 수 없습니다: ${fnName}`));
    return false;
  }
  runner[fnName].apply(runner, args || []);
  return true;
}

/**
 * 진행 중인 호출을 무효화한다. 요청 자체를 중단시킬 수는 없지만,
 * 뒤늦게 도착한 응답이 화면·장바구니를 건드리지 못하게 막는다.
 */
function cancelServerCall(key) {
  delete _serverCallTokens[key];
}

function isServerCallBusy(key) {
  return _serverCallTokens[key] != null;
}

// 재고 로드 in-flight 가드. filterItems 등 다른 코드도 이 값을 읽는다.
let isLoadingStockData = false;
// 로드 중에 들어온 새로고침 요청. 진행 중인 응답은 요청 이전 시점의 재고일 수 있으므로 끝난 뒤 한 번 더 조용히 읽는다.
let queuedStockReload = null;

function runQueuedStockReload() {
  if (!queuedStockReload) return;
  const next = queuedStockReload;
  queuedStockReload = null;
  setTimeout(() => loadStockDataShared(next), 0);
}

/**
 * 재고 데이터 로드의 공통 뼈대: 재진입 가드, 30초 타임아웃, 로딩 표시,
 * localStorage 영속화, 실패 시 로컬 캐시 유지를 담당한다.
 *
 * @param {Object}   options
 * @param {boolean}  options.silent    로딩 인디케이터를 띄우지 않음
 * @param {Function} options.apply     (data) => 최종 배열. 캐시 반영·렌더를 수행하고
 *                                     localStorage에 저장할 배열을 반환한다.
 * @param {Function} options.hasCache  () => boolean. 실패 시 폴백 데이터 보유 여부.
 */
function loadStockDataShared(options) {
  const opts = options || {};
  const silent = !!opts.silent;
  const apply = typeof opts.apply === 'function' ? opts.apply : (data => data);
  const hasCache = typeof opts.hasCache === 'function' ? opts.hasCache : (() => false);

  if (isLoadingStockData) {
    queuedStockReload = { ...opts, silent: true };
    return;
  }
  isLoadingStockData = true;

  let loadingIndicator = null;
  if (!silent) {
    loadingIndicator = document.createElement('div');
    loadingIndicator.id = 'loadingIndicator';
    loadingIndicator.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 10px; border: 1px solid #ccc; z-index: 1000;';
    loadingIndicator.textContent = '재고 데이터 로드 중...';
    document.body.appendChild(loadingIndicator);
  }

  const sent = callServer('getStockData', [], {
    key: 'stockData',
    mode: 'latest', // ★ 최신 응답 수신 보장 (block으로 차단되지 않음)
    timeout: 20000,
    onSuccess: data => {
      const finalData = apply(data || []);
      const stamp = Date.now().toString();
      try {
        localStorage.setItem('cached_stock_data', JSON.stringify(finalData));
        localStorage.setItem('stock_data_updated', stamp);
      } catch (e) {}
      if (typeof opts.onPersisted === 'function') opts.onPersisted(stamp);
    },
    onError: err => {
      const errMsg = (err && err.message) ? err.message : String(err || '알 수 없는 오류');
      console.error('Failed to load stock data:', errMsg);
      if (typeof opts.onError === 'function') opts.onError(err);
      if (hasCache()) {
        console.warn('⚠️ 최신 재고 조회 실패로 로컬 캐시 재고 데이터를 유지합니다:', errMsg);
      } else if (!silent) {
        alert('재고 데이터를 불러오는 데 실패했습니다: ' + errMsg);
      }
    },
    onSettled: () => {
      isLoadingStockData = false;
      if (loadingIndicator && document.body.contains(loadingIndicator)) {
        document.body.removeChild(loadingIndicator);
      }
      if (typeof opts.onSettled === 'function') opts.onSettled();
      runQueuedStockReload();
    }
  });

  if (!sent) {
    isLoadingStockData = false;
    if (loadingIndicator && document.body.contains(loadingIndicator)) {
      document.body.removeChild(loadingIndicator);
    }
    if (typeof opts.onSettled === 'function') opts.onSettled();
  }
}

// printReceipt(입출고증 인쇄)는 src/lib/receiptPrint.js 공용 모듈에 있다 (wms-entry.js가 window에 노출).

// =====================================================================
// 🚀 FlexSearch 기반 초고속 품목/재고 검색엔진 (0.001초 샤샤샥 엔진)
// ---------------------------------------------------------------------
// ktk-wms-v2의 실전 검증된 FlexSearch Document + tokenize: 'full' +
// 스마트 랭킹(rankItemNameMatches) 알고리즘을 완전 탑재하여 수천 개
// 품목 및 12,000+ 셀 매트릭스도 0.001초~0.005초(1~5ms) 내에 즉각 검색합니다.
// =====================================================================
const WmsSearchEngine = (() => {
  let _itemDocIndex = null;
  let _itemMap = new Map();
  let _lastIndexedCount = 0;

  // 1. 스마트 품명 매칭 점수 계산 (ktk-wms-v2 검증 알고리즘)
  // '60' 입력 시 P-160보다 P-D60이 최우선 정렬되도록 가중치 부여
  function scoreItemNameMatch(name, q) {
    const n = String(name || '').toLowerCase();
    if (!n.includes(q)) return 0;
    if (n === q) return 1000;

    let best = 100;
    let from = 0;
    while (from <= n.length) {
      const idx = n.indexOf(q, from);
      if (idx < 0) break;
      const prev = idx > 0 ? n[idx - 1] : '';
      const next = idx + q.length < n.length ? n[idx + q.length] : '';

      if (n.endsWith(q) && idx === n.length - q.length) {
        if (!prev || /[^0-9]/.test(prev)) best = Math.max(best, 900);
        else best = Math.max(best, 250);
      } else if (prev && /[a-z-]/.test(prev) && (!next || /[^0-9]/.test(next))) {
        best = Math.max(best, 800);
      } else if (prev && /\d/.test(prev)) {
        best = Math.max(best, 150);
      } else {
        best = Math.max(best, 500);
      }
      from = idx + 1;
    }
    return best;
  }

  // 2. 검색 결과 스마트 정렬 (정확도 순)
  function rankMatches(items, query) {
    const q = (query || '').trim().toLowerCase();
    if (!q || !items || !items.length) return items || [];

    const scored = [];
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      const rawName = item.name || item.codigo || item.itemName || '';
      let score = scoreItemNameMatch(rawName, q);
      if (score === 0 && (item.color || item.group_name)) {
        const sub = String(item.color || item.group_name || '').toLowerCase();
        if (sub.includes(q)) score = 300;
      }
      if (score > 0) {
        scored.push({ item, idx: i, score });
      }
    }

    scored.sort((a, b) => b.score - a.score || a.idx - b.idx);
    return scored.map(s => s.item);
  }

  // 3. FlexSearch 인덱스 초기화 및 빌드
  function rebuildIndex(items = []) {
    if (!items || !items.length) {
      _itemMap.clear();
      _itemDocIndex = null;
      _lastIndexedCount = 0;
      return;
    }

    const FlexSearchLib = window.FlexSearch;
    if (FlexSearchLib) {
      const Document = FlexSearchLib.Document || FlexSearchLib;
      _itemDocIndex = new Document({
        document: {
          id: 'k',
          index: ['name', 'cleanName', 'color'],
          store: false
        },
        tokenize: 'full', // 접두뿐 아니라 중간/끝 부분도 완벽 색인 (P-D60 -> D60, 60)
        cache: true,
        optimize: true
      });
    }

    _itemMap = new Map();
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      if (!it) continue;
      const rawName = it.name || it.codigo || it.itemName || '';
      if (!rawName) continue;
      const k = it.key || `${rawName}___${it.color || 'SURTIDO'}___${it.boxContent || 0}`;
      _itemMap.set(k, it);

      if (_itemDocIndex) {
        _itemDocIndex.add({
          k: k,
          name: rawName,
          cleanName: rawName.replace(/[\s_\-\/]/g, ''),
          color: it.color || ''
        });
      }
    }
    _lastIndexedCount = items.length;
    console.log(`⚡ [WmsSearchEngine] FlexSearch 인덱스 빌드 완료 (${_lastIndexedCount}개 품목)`);
  }

  // 4. 초고속 검색 질의 (0.001초 미만 완료)
  function search(query, options = {}) {
    const q = (query || '').trim().toLowerCase();
    const limit = options.limit || 20;
    const sourceItems = options.items || Array.from(_itemMap.values());

    if (!q) {
      return sourceItems.slice(0, limit);
    }

    if (_itemDocIndex && sourceItems.length !== _lastIndexedCount) {
      rebuildIndex(sourceItems);
    }

    const aliasInfo = typeof resolveModelAlias === 'function' ? resolveModelAlias(q) : null;
    const targetClean = aliasInfo ? aliasInfo.targetModel.toLowerCase().replace(/[\s_\-\/]/g, '') : null;

    let candidateItems = [];

    if (_itemDocIndex) {
      const rawResults = _itemDocIndex.search(q, { limit: limit * 4 });
      const seen = new Set();

      for (let f = 0; f < rawResults.length; f++) {
        const idList = rawResults[f].result || [];
        for (let i = 0; i < idList.length; i++) {
          const id = idList[i];
          if (!seen.has(id)) {
            seen.add(id);
            const item = _itemMap.get(id);
            if (item) candidateItems.push(item);
          }
        }
      }

      if (targetClean) {
        for (let i = 0; i < sourceItems.length; i++) {
          const it = sourceItems[i];
          const rawName = it.name || it.codigo || it.itemName || '';
          if (rawName.toLowerCase().replace(/[\s_\-\/]/g, '') === targetClean) {
            const k = it.key || `${rawName}___${it.color || 'SURTIDO'}___${it.boxContent || 0}`;
            if (!seen.has(k)) {
              seen.add(k);
              candidateItems.push(it);
            }
          }
        }
      }
    } else {
      const searchClean = q.replace(/[\s_\-\/]/g, '');
      for (let i = 0; i < sourceItems.length; i++) {
        const it = sourceItems[i];
        const rawName = (it.name || it.codigo || it.itemName || '').toLowerCase();
        const clean = rawName.replace(/[\s_\-\/]/g, '');
        const color = (it.color || '').toLowerCase();

        if (rawName.includes(q) || clean.includes(searchClean) || color.includes(q) || (targetClean && clean === targetClean)) {
          candidateItems.push(it);
        }
      }
    }

    const ranked = rankMatches(candidateItems, q);
    return ranked.slice(0, limit);
  }

  return {
    scoreItemNameMatch,
    rankMatches,
    rebuildIndex,
    search
  };
})();
window.WmsSearchEngine = WmsSearchEngine;
</script>

<script>
/**
 * 탭 전환 브릿지 (메인 WMS 창 연동)
 * - iframe 모달로 열린 경우: 부모 창(window.parent)의 setPage 호출 후 모달 닫기
 * - 단독 창으로 열린 경우: 메인 WMS URL로 페이지 파라미터와 함께 이동
 */
function setPage(pageName) {
  if (pageName === '검색수정') return;
  if (window.parent && window.parent !== window && typeof window.parent.setPage === 'function') {
    try {
      window.parent.setPage(pageName);
      if (typeof window.parent.closeSearchModifyModal === 'function') {
        window.parent.closeSearchModifyModal();
      }
      return;
    } catch (err) {
      console.warn('[SearchModify] 부모 창 setPage 호출 실패, location 이동 대체:', err);
    }
  }
  window.location.href = '/?page=' + encodeURIComponent(pageName);
}
window.setPage = setPage;

let dropdownVisible = false;
let records = [];
let originalRecords = [];
let currentType = 'in';
let selectedDate;
let stockDataCache = [];
try {
  const cachedStock = localStorage.getItem('cached_stock_data') || sessionStorage.getItem('cached_stock_data');
  if (cachedStock) stockDataCache = JSON.parse(cachedStock);
} catch (e) {}
let locationCacheByType = { in: null, out: null, adj: null };
let debounceTimeout;
// isLoadingStockData는 Shared.html이 소유한다.

document.addEventListener('DOMContentLoaded', function() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('searchDate').value = today;

// 크로스 윈도우/탭 실시간 재고 동기화 리스너
window.addEventListener('storage', function(e) {
  if (e.key === 'cached_stock_data' || e.key === 'stock_data_updated') {
    try {
      const cachedStock = localStorage.getItem('cached_stock_data');

window.addEventListener('focus', function() {

// 🔄 재고 변경 자동 반영 (stockSync.js). 이 탭의 수정은 처리 후 이미 다시 읽는다.
window.addEventListener('wms-stock-changed', e => {
  const d = e.detail || {};

function loadStockData(silent = false) {

    silent: silent,
    hasCache: () => stockDataCache && stockDataCache.length > 0,
    apply: data => {
      stockDataCache = data;
      return stockDataCache;
    }

}

function updateLocationLabel(type) {
  const label = document.getElementById('locationLabel');
  if (label) {
    label.textContent = type === 'in' ? '입고처:' : (type === 'adj' ? '조정유형/위치:' : '출고처:');
  }
}

function loadDropdowns() {
  const select = document.getElementById('location');
  if (!select) return;

  const type = currentType || 'in';
  updateLocationLabel(type);

  if (locationCacheByType[type] && locationCacheByType[type].length > 0) {
    select.innerHTML = '<option value="">선택</option>' + locationCacheByType[type].map(loc => `<option value="${escapeHtml(loc)}">${escapeHtml(loc)}</option>`).join('');
    return;
  }

  if (type === 'adj') {
    callServer('getOutLocations', [], {
      key: 'locations_adj',
      mode: 'latest',
      onSuccess: data => {
        const defaultAdj = ['재고조정', '치환', '추가', '간편실사', 'MAIN'];
        const merged = Array.from(new Set([...defaultAdj, ...(data || [])]));
        locationCacheByType.adj = merged;
        select.innerHTML = '<option value="">선택</option>' + merged.map(loc => `<option value="${escapeHtml(loc)}">${escapeHtml(loc)}</option>`).join('');
      },
      onError: () => {
        const fallback = ['재고조정', '치환', '추가', '간편실사', 'MAIN'];
        locationCacheByType.adj = fallback;
        select.innerHTML = '<option value="">선택</option>' + fallback.map(loc => `<option value="${escapeHtml(loc)}">${escapeHtml(loc)}</option>`).join('');
      }
    });
    return;
  }

  const serverFunc = type === 'in' ? 'getInLocations' : 'getOutLocations';
  callServer(serverFunc, [], {
    key: `locations_${type}`,
    mode: 'latest',
    onSuccess: data => {
      locationCacheByType[type] = data || [];
      select.innerHTML = '<option value="">선택</option>' + (data || []).map(loc => `<option value="${escapeHtml(loc)}">${escapeHtml(loc)}</option>`).join('');
    },
    onError: err => {
      console.error(`Failed to load ${type} locations:`, err);
      alert(`${type === 'in' ? '입고처' : '출고처'} 데이터를 불러오는 데 실패했습니다.`);
    }
  });
}

function filterItems(searchText) {
  if (!searchText.trim()) {
    hideCustomDropdown();
    return;
  }

  if (isLoadingStockData) return;

  clearTimeout(debounceTimeout);
  debounceTimeout = setTimeout(() => {
    const list = document.getElementById('itemSuggestionsList');
    if (!list) return;

    // 🚀 FlexSearch 기반 초고속 검색 & 스마트 랭킹 (0.001초 샤샤샥 엔진)
    const filteredItems = typeof WmsSearchEngine !== 'undefined'
      ? WmsSearchEngine.search(searchText, { items: stockDataCache, limit: 20 })
      : stockDataCache.filter(item => item.name.toLowerCase().includes(searchText.toLowerCase())).slice(0, 20);

    list.innerHTML = '';
    const fragment = document.createDocumentFragment();
    filteredItems.forEach(item => {
      const li = document.createElement('li');
      li.textContent = `${item.name} (${item.color}, ${item.stockBox}박스 + ${item.stockIndividual}개, 안전재고 ${item.safeStock}, 포장 ${item.boxContent}개)`;
      li.onclick = () => selectItem(item.name, item.color, item.boxContent);
      fragment.appendChild(li);
    });
    list.appendChild(fragment);

    if (filteredItems.length > 0) {
      showCustomDropdown();
    } else {
      hideCustomDropdown();
    }
  }, 50);
}

function checkItemAndStock(itemName, color, boxContent, qty, unitType, tempStockCache = stockDataCache) {
  const key = `${itemName}_${color || 'SURTIDO'}_${boxContent || 0}`;
  const item = tempStockCache.find(item => item.key === key);

  if (!item) {
    return { isRegistered: false };
  }

  if (unitType === 'box') {
    return { isRegistered: true, isSufficient: item.stockBox >= qty, boxStock: item.stockBox };
  } else {
    let totalIndividual = item.stockIndividual;
    let remainingQty = qty;
    let boxesNeeded = 0;
    let boxStock = item.stockBox;
    while (totalIndividual < remainingQty && boxStock > 0) {
      if (item.boxContent <= 0) {
        return { isRegistered: true, isSufficient: false, message: '박스당 내용물 개수가 유효하지 않습니다.' };
      }
      boxesNeeded++;
      totalIndividual += item.boxContent;
      boxStock--;
    }
    return {
      isRegistered: true,
      isSufficient: totalIndividual >= remainingQty && boxStock >= 0,
      boxStock: item.stockBox,
      individualStock: item.stockIndividual,
      boxesNeeded
    };
  }
}

let loadedReceipt = null;

/** 불러온 전표의 창고를 배너에 표시한다. 입고는 도착 창고이므로 DESTINO로 표기. */
function renderLoadedOrigin() {

/**
 * 장바구니(현재 표)에 있는 전표를 기존 printReceipt 양식으로 다시 출력한다.
 * 서버에는 아무것도 쓰지 않는다.
 */
function reprintReceipt() {
  if (!loadedReceipt) {
    alert('먼저 [전표 검색]으로 전표를 불러오세요.');
    return;
  }
  if (records.length === 0) {

function displayRecords(recordsData) {

    boxQty: record.boxQty,
    individualQty: record.individualQty,

    unitType: record.boxQty !== 0 ? 'box' : 'individual'
  }));

    loadedReceipt.warehouse = recordsData[0].warehouse;
    loadedReceipt.txType = recordsData[0].txType;
    loadedReceipt.returnOf = recordsData[0].returnOf || '';
  }
  renderLoadedOrigin();
  renderReturnControls();
  updateTable();

  if (records.length > 0) {
    const firstLocation = records[0].location;
    const firstAdmin = recordsData[0].admin || 'ADMIN';
    const locationSelect = document.getElementById('location');
    
    if (!Array.from(locationSelect.options).some(opt => opt.value === firstLocation)) {
      const newOption = document.createElement('option');
      newOption.value = firstLocation;
      newOption.text = firstLocation;
      locationSelect.add(newOption);
    }

    document.getElementById('adminInput').value = firstAdmin;
  } else {
    document.getElementById('location').value = '';

function addRecord() {
  const checkedRadio = document.querySelector('input[name="recordType"]:checked');
  currentType = checkedRadio ? checkedRadio.value : 'in';
  const unitType = document.querySelector('input[name="unitType"]:checked').value;
  const qty = parseInt(document.getElementById('qty').value) || 0;
  const itemName = document.getElementById('itemName').value.trim();
  const color = document.getElementById('color').value;
  const boxContent = parseInt(document.getElementById('boxContent').value) || 0;
  const location = document.getElementById('location').value;

  if (!itemName || !location || (!qty && unitType === 'box') || (!qty && unitType === 'individual')) {
    alert('필수 항목(품명, 입출고처, 수량)을 입력하세요.');
    return;
  }

  const stockInfo = checkItemAndStock(itemName, color, boxContent, qty, unitType);
  if (!stockInfo.isRegistered) {
    const confirmRegister = confirm('등록되지 않은 상품입니다. 상품을 등록하시겠습니까?');
    if (confirmRegister) {
      const currentData = { itemName, color, boxContent, qty, unitType, location, type: currentType };
      sessionStorage.setItem('pendingData', JSON.stringify(currentData));
      setPage('상품등록', currentData);
    }
    return;
  }

  if (currentType === 'out' && !stockInfo.isSufficient) {
    showStockWarningModal(qty, unitType === 'box' ? stockInfo.boxStock : stockInfo.individualStock, unitType === 'box' ? '박스' : '낱개');
    return;
  }

  const formData = {
    itemName,
    color,
    boxQty: unitType === 'box' ? (currentType === 'out' ? -qty : qty) : 0,
    individualQty: unitType === 'individual' ? (currentType === 'out' ? -qty : qty) : 0,
    boxContent,
    location,
    unitType
  };
  if (currentType === 'out' && unitType === 'individual') {
    const proceed = confirm('낱개출고입니다. 진행할까요?');
    if (!proceed) {
      return;
    }
  }
  records.push(formData);
  updateTable();
  clearForm();
  toggleScroll();
  updateTotals();
}

function handleEditableFocus(el, e) {
  if (e) e.stopPropagation();
  const container = document.getElementById('scrollableTable');
  const prevLeft = container ? container.scrollLeft : 0;
  const prevTop = container ? container.scrollTop : 0;

  requestAnimationFrame(() => {
    if (container) {
      container.scrollLeft = prevLeft;
      container.scrollTop = prevTop;
    }
    try {
      const selection = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(el);
      selection.removeAllRanges();
      selection.addRange(range);
    } catch (err) {}
  });
}

// 재고조정 전표는 부호 있는 증감(Δ)이므로 부호를 유지해 표시한다.
function qtyForDisplay(v) {
  const typeRadio = document.querySelector('input[name="recordType"]:checked');
  const n = Number(v) || 0;
  return typeRadio && typeRadio.value === 'adj' ? n : Math.abs(n);
}

function handleEditableKeyDown(e, el, idx, field) {
  if (e.key === 'Enter') {
    e.preventDefault();
    el.blur();
  } else if (e.key === 'Escape') {
    e.preventDefault();
    if (records && records[idx]) {
      el.textContent = qtyForDisplay(records[idx][field]);
    }
    el.blur();
  }
}

function updateTable() {
  const tbody = document.getElementById('tableBody');
  let html = '';
  records.forEach((rec, idx) => {
    html += `
      <tr>
        <td><input type="checkbox" class="rowCheckbox" data-index="${idx}"></td>
        <td>${escapeHtml(rec.itemName)}</td>
        <td>${escapeHtml(rec.color)}</td>
        <td contenteditable="true" tabindex="0" class="editable" onmousedown="event.stopPropagation()" onclick="event.stopPropagation()" ondblclick="event.stopPropagation()" onfocus="handleEditableFocus(this, event)" onkeydown="handleEditableKeyDown(event, this, ${idx}, 'boxQty')" onblur="updateRecord(${idx}, 'boxQty', this.textContent)">${qtyForDisplay(rec.boxQty)}</td>
        <td contenteditable="true" tabindex="0" class="editable" onmousedown="event.stopPropagation()" onclick="event.stopPropagation()" ondblclick="event.stopPropagation()" onfocus="handleEditableFocus(this, event)" onkeydown="handleEditableKeyDown(event, this, ${idx}, 'individualQty')" onblur="updateRecord(${idx}, 'individualQty', this.textContent)">${qtyForDisplay(rec.individualQty)}</td>
        <td>${rec.boxContent}</td>
        <td>${escapeHtml(rec.location)}</td>
      </tr>
    `;
  });
  tbody.innerHTML = html;
}

function updateRecord(index, field, value) {
  if (index < 0 || index >= records.length) return;
  const typeRadio = document.querySelector('input[name="recordType"]:checked');
  const type = typeRadio ? typeRadio.value : 'out';
  const numVal = parseInt(value) || 0;
  const targetVal = type === 'out' ? -numVal : numVal;

  if (records[index][field] === targetVal) {
    return; // 변경 사항 없으면 재렌더링 차단
  }

  records[index][field] = targetVal;
  if (records[index].boxQty !== 0) {
    records[index].unitType = 'box';
  } else {
    records[index].unitType = 'individual';
  }
  updateTable();
  updateTotals();
  toggleScroll();
}

function clearForm() {
  document.getElementById('itemName').value = '';
  document.getElementById('color').value = '';
  document.getElementById('boxContent').value = '';
  document.getElementById('qty').value = '';
}

function toggleScroll() {
  const table = document.getElementById('scrollableTable');
  table.classList.toggle('scroll-enabled', records.length >= 5);
}

function updateTotals() {
  const totalItems = records.length;
  const totalBoxes = records.reduce((sum, rec) => sum + Math.abs(rec.boxQty), 0);
  const totalIndividuals = records.reduce((sum, rec) => sum + Math.abs(rec.individualQty), 0);
  document.getElementById('totalItems').textContent = totalItems;
  document.getElementById('totalBoxesLabel').textContent = `Total Boxes: ${totalBoxes}`;
  document.getElementById('totalIndividualsLabel').textContent = `Total Individuals: ${totalIndividuals}`;
}

function updateRecords() {
  const checkedRadio = document.querySelector('input[name="recordType"]:checked');
  const typeValue = checkedRadio ? checkedRadio.value : 'in';
  const type = typeValue === 'in' ? '입고' : (typeValue === 'adj' ? '재고조정' : '출고');
  const invoiceNumber = document.getElementById('invoiceNumber').value;
  const date = document.getElementById('searchDate').value;
  const fullInvoiceNumber = `${date.replace(/-/g, '/')}-${invoiceNumber.padStart(3, '0')}`;
  const adminValue = document.getElementById('adminInput').value;
  const loadedInvoiceNumber = document.getElementById('loadedInvoiceNumber').textContent;
if (invoiceNumber.padStart(3, '0') !== loadedInvoiceNumber) {
    alert('로드값과 변경값이 틀립니다.');
    return;
  }
  // 업데이트 처리 중 UI 피드백
  const buttonContainer = document.querySelector('.submit').parentNode;
  const originalButton = document.querySelector('.submit');
  originalButton.style.visibility = 'hidden';
  const processingButton = document.createElement('div');
  processingButton.className = 'processing-button';
  processingButton.textContent = '처리 중...';
  buttonContainer.appendChild(processingButton);

  // 레코드가 없을 경우 삭제 처리
  if (records.length === 0) {
    const confirmDelete = confirm(`${date} ${invoiceNumber}번 ${type}를 삭제하시겠습니까?` +
      (typeValue === 'out' ? '\n\n반품이라면 삭제하지 말고 [↩️ 반품 입고]로 기록하세요. 삭제하면 판매 이력이 사라집니다.' : ''));
    if (confirmDelete) {
      callServer('updatePendingRecords', [fullInvoiceNumber, type, [], adminValue], {
        key: 'updateRecords',
        timeout: 90000,
        onSuccess: () => {
          alert('레코드가 성공적으로 삭제되었습니다.');
          loadStockData(true); // 즉시 백그라운드 재고 갱신
          records = [];
          updateTable();
          updateTotals();
          toggleScroll();
          originalButton.style.visibility = 'visible';
          buttonContainer.removeChild(processingButton);
        },
        onError: err => {
          alert('삭제 실패: ' + err.message);
          originalButton.style.visibility = 'visible';
          buttonContainer.removeChild(processingButton);
        }
      });
    } else {
      originalButton.style.visibility = 'visible';
      buttonContainer.removeChild(processingButton);
    }
    return;
  }

  // 재고 검증을 위한 임시 재고 캐시 생성
  let tempStockCache = JSON.parse(JSON.stringify(stockDataCache)); // 깊은 복사
  if (typeValue === 'out' && originalRecords.length > 0) {
    // 기존 레코드의 재고 반환 시뮬레이션
    originalRecords.forEach(record => {
      const key = `${record.itemName}_${record.color || 'SURTIDO'}_${record.boxContent || 0}`;
      const item = tempStockCache.find(item => item.key === key);
      if (item) {
        // 출고 레코드 삭제 시 재고 증가
        item.stockBox += Math.abs(record.boxQty);
        item.stockIndividual += Math.abs(record.individualQty);
      }
    });
  }

  // 새 레코드에 대해 재고 검증
  if (typeValue === 'out') {
    for (const record of records) {
      const bQty = Math.abs(record.boxQty) || 0;
      const iQty = Math.abs(record.individualQty) || 0;

      if (bQty > 0) {
        const boxInfo = checkItemAndStock(
          record.itemName,
          record.color,
          record.boxContent,
          bQty,
          'box',
          tempStockCache
        );
        if (!boxInfo.isSufficient) {
          alert(`박스 재고 부족: ${record.itemName} (${record.color}) - 필요: ${bQty}박스`);
          originalButton.style.visibility = 'visible';
          buttonContainer.removeChild(processingButton);
          return;
        }
      }

      if (iQty > 0) {
        const indInfo = checkItemAndStock(
          record.itemName,
          record.color,
          record.boxContent,
          iQty,
          'individual',
          tempStockCache
        );
        if (!indInfo.isSufficient) {
          alert(`낱개 재고 부족: ${record.itemName} (${record.color}) - 필요: ${iQty}개`);
          originalButton.style.visibility = 'visible';
          buttonContainer.removeChild(processingButton);
          return;
        }
      }
    }
  }

  // 새 레코드로 업데이트
  const recordsToPrint = [...records];
  callServer('updatePendingRecords', [fullInvoiceNumber, type, records, adminValue], {
    key: 'updateRecords',
    timeout: 90000,
    onSuccess: () => {
      alert('레코드가 성공적으로 업데이트되었습니다.');
      loadStockData(true); // ★ 핵심: 인쇄 대기 없이 백그라운드에서 즉시 재고 갱신 시작!
      printReceipt(recordsToPrint, typeValue, date, adminValue, fullInvoiceNumber, () => {
        records = [];
        updateTable();
        updateTotals();
        toggleScroll();
        originalButton.style.visibility = 'visible';
        buttonContainer.removeChild(processingButton);
        loadStockData(true); // 인쇄 콜백 완료 후 재확인
      }, loadedReceipt);
    },
    onError: err => {
      alert('업데이트 실패: ' + err.message);
      originalButton.style.visibility = 'visible';
      buttonContainer.removeChild(processingButton);
    }
  });
}


function showCustomDropdown() {
  const dropdown = document.getElementById('customDropdown');
  const input = document.getElementById('itemName');
  if (!dropdown || !input) return;
  const rect = input.getBoundingClientRect();
  dropdown.style.display = 'block';
  dropdown.style.top = `${rect.bottom + window.scrollY}px`;
  dropdown.style.left = `${rect.left + window.scrollX}px`;
  dropdownVisible = true;
}

function hideCustomDropdown() {
  const dropdown = document.getElementById('customDropdown');
  if (dropdown) {
    dropdown.style.display = 'none';
    dropdownVisible = false;
  }
}

function selectItem(name, color, boxContent) {
  document.getElementById('itemName').value = name;
  document.getElementById('color').value = color || 'SURTIDO';
  document.getElementById('boxContent').value = boxContent || '';
  hideCustomDropdown();
}

function autoFillColor() {
  const itemNameInput = document.getElementById('itemName');
  if (!itemNameInput) return;
  const val = itemNameInput.value.trim();
  const matched = stockDataCache.find(item => item.name === val || item.key === val);
  if (matched) {
    itemNameInput.value = matched.name;
    const colorInput = document.getElementById('color');
    const boxContentInput = document.getElementById('boxContent');
    if (colorInput) colorInput.value = matched.color || 'SURTIDO';
    if (boxContentInput) boxContentInput.value = matched.boxContent || '';
  }
}

function setupDropdownEvents() {
  const itemNameInput = document.getElementById('itemName');
  if (itemNameInput) {
    itemNameInput.addEventListener('blur', () => setTimeout(hideCustomDropdown, 100));
  }
  document.addEventListener('click', (e) => {
    const dropdown = document.getElementById('customDropdown');
    const itemName = document.getElementById('itemName');
    if (dropdown && itemName && !itemName.contains(e.target) && !dropdown.contains(e.target)) {
      hideCustomDropdown();
    }
  });
}

function incrementInvoice() {
  const currentSeq = parseInt(document.getElementById('invoiceNumber').value);
  if (isNaN(currentSeq)) return;
  const date = document.getElementById('searchDate').value;
  const checkedRadio = document.querySelector('input[name="recordType"]:checked');
  const typeValue = checkedRadio ? checkedRadio.value : 'in';
  const type = typeValue === 'in' ? '입고' : (typeValue === 'adj' ? '재고조정' : '출고');
  callServer('getMaxSequentialNumber', [date, type], {
    key: 'maxSeq',
    mode: 'latest',
    onSuccess: maxSeq => {
      if (currentSeq < maxSeq) {
        document.getElementById('invoiceNumber').value = String(currentSeq + 1).padStart(3, '0');
      } else {
        alert(`선택한 ${type} 전표는 없습니다`);
      }
    },
    onError: err => alert('영수증 번호 조회 실패: ' + (err && err.message ? err.message : err))
  });
}

function decrementInvoice() {
  const currentSeq = parseInt(document.getElementById('invoiceNumber').value);
  const checkedRadio = document.querySelector('input[name="recordType"]:checked');
  const typeValue = checkedRadio ? checkedRadio.value : 'in';
  const type = typeValue === 'in' ? '입고' : (typeValue === 'adj' ? '재고조정' : '출고');
  if (isNaN(currentSeq) || currentSeq <= 1) {
    alert(`선택한 ${type} 전표는 없습니다`);
    return;
  }
  document.getElementById('invoiceNumber').value = String(currentSeq - 1).padStart(3, '0');
}

function toggleSelectAll() {
  const selectAll = document.getElementById('selectAll').checked;
  document.querySelectorAll('.rowCheckbox').forEach(cb => cb.checked = selectAll);
}

/* ───────── 반품 입고 ─────────
 * 원 출고 전표는 지우지 않고, 반품을 오늘 날짜의 새 입고 전표(원 전표번호 연결)로 남긴다.
 * 원 출고 수량을 넘는 반품은 서버(rpc_process_return)가 거절한다. 화면 검사는 안내용.
 */
let returnCtx = null;

function renderReturnControls() {
  const btn = document.getElementById('btnOpenReturn');
  const tag = document.getElementById('loadedReturnOf');
  const isOut = !!(loadedReceipt && loadedReceipt.txType === 'OUTBOUND');
  if (btn) btn.style.display = isOut ? '' : 'none';
  if (tag) {
    const of = loadedReceipt && loadedReceipt.txType === 'INBOUND' ? loadedReceipt.returnOf : '';
    tag.textContent = of ? `↩️ 반품 전표 · 원 출고 ${of}` : '';
    tag.style.display = of ? 'inline-block' : 'none';
  }
}

function openReturnModal() {
  if (!loadedReceipt || loadedReceipt.txType !== 'OUTBOUND') {
    alert('먼저 [출고]를 선택해 원 출고 전표를 불러오세요.');
    return;
  }
  if (JSON.stringify(records) !== JSON.stringify(originalRecords)) {
    alert('저장(Update)되지 않은 변경 내용이 있습니다. 전표를 다시 불러온 뒤 반품하세요.');
    return;
  }
  const invoice = `${loadedReceipt.date.replace(/-/g, '/')}-${loadedReceipt.paddedSeq}`;
  returnCtx = { invoice, data: null };
  document.getElementById('returnMeta').textContent = `원 출고 전표 ${invoice} 불러오는 중...`;
  document.getElementById('returnLines').innerHTML = '';
  document.getElementById('returnMemo').value = '';
  document.getElementById('returnStatus').textContent = '';
  document.getElementById('returnSubmit').disabled = true;
  document.getElementById('returnModalBackdrop').style.display = 'flex';

  callServer('getWarehouses', [], {
    key: 'returnWarehouses',
    mode: 'latest',
    onSuccess: list => {
      const sel = document.getElementById('returnWarehouse');
      const codes = (list || []).map(w => String(w.code || '').toUpperCase()).filter(Boolean);
      if (!codes.includes('MAIN')) codes.unshift('MAIN');
      sel.innerHTML = codes.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
      sel.value = 'MAIN';
    },
    onError: err => console.warn('[반품] 창고 목록 조회 실패:', err)
  });

  callServer('getInvoiceReturnable', [invoice], {
    key: 'getInvoiceReturnable',
    mode: 'latest',
    onSuccess: data => {
      if (!returnCtx || returnCtx.invoice !== invoice) return;
      returnCtx.data = data;
      renderReturnLines();
    },
    onError: err => {
      document.getElementById('returnMeta').textContent = '반품 정보를 불러오지 못했습니다: ' + (err && err.message ? err.message : err);
    }
  });
}

function closeReturnModal() {
  document.getElementById('returnModalBackdrop').style.display = 'none';
  returnCtx = null;
}

/** 낱개 수를 '상자 + 낱개'로 표시 */
function fmtReturnUnits(units, pack) {
  const p = Math.max(1, Number(pack) || 1);
  const n = Math.max(0, Number(units) || 0);
  if (p === 1) return `${n}개`;
  const b = Math.floor(n / p);
  const u = n % p;
  return u ? `${b}상자 ${u}개` : `${b}상자`;
}

function renderReturnLines() {
  const d = returnCtx && returnCtx.data;
  if (!d) return;
  const prev = (d.return_invoices || []).length
    ? ` · 이전 반품 전표: ${d.return_invoices.map(escapeHtml).join(', ')}`
    : '';
  document.getElementById('returnMeta').innerHTML =
    `원 출고 전표 <b>${escapeHtml(d.invoice_no)}</b> · 거래처 <b>${escapeHtml(d.partner || '-')}</b> · 출고창고 ${escapeHtml(d.warehouse || 'MAIN')}${prev}<br>` +
    '반품은 오늘 날짜의 새 입고 전표로 기록되고, 원 출고 전표는 그대로 남습니다.';
  document.getElementById('returnLines').innerHTML = (d.lines || []).map((ln, i) => {
    const done = Number(ln.remaining_units) <= 0;
    const pack = Number(ln.pack) || 1;
    return `<tr class="${done ? 'ret-done' : ''}">
      <td>${escapeHtml(ln.item_name || '')}</td>
      <td>${escapeHtml(ln.color || '')}</td>
      <td>${pack}</td>
      <td>${fmtReturnUnits(ln.out_units, pack)}</td>
      <td>${Number(ln.returned_units) ? fmtReturnUnits(ln.returned_units, pack) : '-'}</td>
      <td><b>${fmtReturnUnits(ln.remaining_units, pack)}</b></td>
      <td><input type="number" min="0" step="1" data-ret-idx="${i}" data-ret-field="box" ${done || pack <= 1 ? 'disabled' : ''} oninput="onReturnQtyInput()"></td>
      <td><input type="number" min="0" step="1" data-ret-idx="${i}" data-ret-field="unit" ${done ? 'disabled' : ''} oninput="onReturnQtyInput()"></td>
    </tr>`;
  }).join('');
  onReturnQtyInput();
}

/** 입력값 → [{ item_id, box_qty, unit_qty, units, over, ... }] */
function collectReturnItems() {
  const d = returnCtx && returnCtx.data;
  if (!d) return [];
  const byIdx = new Map();
  document.querySelectorAll('#returnLines input[data-ret-idx]').forEach(inp => {
    const i = Number(inp.dataset.retIdx);
    const cur = byIdx.get(i) || { box: 0, unit: 0 };
    cur[inp.dataset.retField] = Math.max(0, Math.trunc(Number(inp.value) || 0));
    byIdx.set(i, cur);
  });
  const items = [];
  byIdx.forEach((q, i) => {
    const ln = d.lines[i];
    if (!ln || (q.box === 0 && q.unit === 0)) return;
    const pack = Math.max(1, Number(ln.pack) || 1);
    const units = q.box * pack + q.unit;
    items.push({
      item_id: ln.item_id, box_qty: q.box, unit_qty: q.unit, units,
      name: ln.item_name, color: ln.color, pack,
      over: units > Number(ln.remaining_units || 0)
    });
  });
  return items;
}

function onReturnQtyInput() {
  const items = collectReturnItems();
  const over = items.filter(it => it.over);
  const status = document.getElementById('returnStatus');
  if (over.length) {
    status.style.color = '#b91c1c';
    status.textContent = `남은 수량을 넘었습니다: ${over.map(it => `${it.name}(${it.color})`).join(', ')}`;
  } else {
    status.style.color = '#475569';
    status.textContent = items.length ? `반품 ${items.length}개 품목` : '반품할 수량을 입력하세요.';
  }
  document.getElementById('returnSubmit').disabled = !items.length || over.length > 0;
}

function submitReturn() {
  const d = returnCtx && returnCtx.data;
  if (!d) return;
  const items = collectReturnItems();
  if (!items.length || items.some(it => it.over)) return;
  const wh = document.getElementById('returnWarehouse').value || 'MAIN';
  const memo = document.getElementById('returnMemo').value.trim();
  const summary = items.map(it => `- ${it.name} (${it.color}): ${fmtReturnUnits(it.units, it.pack)}`).join('\n');
  if (!confirm(`원 출고 전표 ${d.invoice_no} (${d.partner || '-'})의 반품을 ${wh} 창고로 입고합니다.\n\n${summary}\n\n진행할까요?`)) return;

  const btn = document.getElementById('returnSubmit');
  const status = document.getElementById('returnStatus');
  btn.disabled = true;
  status.style.color = '#475569';
  status.textContent = '⏳ 반품 기록 중...';
  const payload = items.map(({ item_id, box_qty, unit_qty }) => ({ item_id, box_qty, unit_qty }));
  callServer('processReturn', [d.invoice_no, wh, memo, payload], {
    key: 'processReturn',
    timeout: 60000,
    onSuccess: res => {
      alert(`반품이 기록되었습니다.\n반품 전표: ${(res && res.invoice_no) || '-'} (입고 · ${wh})\n원 출고 전표 ${d.invoice_no}는 그대로 남아 있습니다.`);
      loadStockData(true);
      closeReturnModal();
    },
    onLateSuccess: () => {
      alert('응답이 늦게 도착했지만 반품이 기록되었을 수 있습니다. 다시 누르지 말고 전표를 다시 불러와 확인하세요.');
    },
    onError: err => {
      status.style.color = '#b91c1c';
      status.textContent = '반품 실패: ' + (err && err.message ? err.message : err);
      btn.disabled = false;
    }
  });
}
